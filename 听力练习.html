<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>👂 听力练习 · 四年级上册</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, 'PingFang SC', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: linear-gradient(145deg, #f5f9e6 0%, #e2f0d6 100%);
            transition: background 0.4s ease;
        }
        /* ===== 容器 ===== */
        .app-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 60px rgba(80, 120, 60, 0.12);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        /* ===== 顶部 ===== */
        .header {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }
        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #3a6b2a;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }
        .logo span {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 14px;
            border-radius: 30px;
            margin-left: 4px;
        }
        .header-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
        }
        .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .ctrl-group label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #5a7a4a;
            font-weight: 700;
        }
        .ctrl-group select,
        .ctrl-group .mode-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(180, 200, 140, 0.4);
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #2a4a1a;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .ctrl-group select:hover,
        .ctrl-group .mode-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #a0c870;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(80, 140, 40, 0.08);
        }
        .mode-toggle-group {
            display: flex;
            gap: 4px;
            background: rgba(200, 220, 160, 0.2);
            padding: 3px 8px;
            border-radius: 40px;
            align-items: center;
        }
        .mode-toggle-group .mode-btn {
            padding: 4px 16px;
            font-size: 0.72rem;
            background: transparent;
            border-color: transparent;
        }
        .mode-toggle-group .mode-btn.active {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(139, 195, 74, 0.25);
        }
        /* ===== 主内容 ===== */
        .main-content {
            padding: 18px 24px 24px;
        }
        .single-mode {
            display: block;
        }
        .pk-mode {
            display: none;
        }
        /* ===== 信息栏 ===== */
        .info-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #2a4a1a;
        }
        .info-item .num {
            background: rgba(139, 195, 74, 0.15);
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 700;
            color: #3a6b2a;
        }
        .info-item .score-num {
            background: linear-gradient(135deg, #ffb74d, #ff8a65);
            color: #fff;
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 700;
        }
        /* ===== 听力区 ===== */
        .listening-area {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 20px 24px 22px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
            text-align: center;
            transition: all 0.3s;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 24px;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 700;
            background: rgba(200, 220, 160, 0.25);
            color: #3a6b2a;
            border: 1px solid rgba(180, 200, 140, 0.2);
            transition: all 0.3s;
            margin-bottom: 12px;
        }
        .status-badge.playing {
            background: #d4e8c0;
            color: #2a5a1a;
            border-color: #8bc34a;
            animation: pulse-badge 0.9s infinite;
        }
        .status-badge.done {
            background: #d4e8c0;
            color: #2a6a2a;
            border-color: #8bc34a;
        }
        .status-badge.correct {
            background: #c8e6c9;
            color: #1a6a2a;
            border-color: #66bb6a;
        }
        .status-badge.wrong {
            background: #ffcdd2;
            color: #a33a3a;
            border-color: #ef9a9a;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .audio-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin: 6px 0 12px;
        }
        .audio-btn {
            padding: 9px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
        }
        .audio-btn:active {
            transform: scale(0.94);
        }
        .audio-btn.primary {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            box-shadow: 0 4px 20px rgba(139, 195, 74, 0.25);
        }
        .audio-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(139, 195, 74, 0.3);
        }
        .audio-btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .audio-btn.secondary {
            background: rgba(255, 255, 255, 0.6);
            color: #3a6b2a;
            border: 1px solid rgba(180, 200, 140, 0.3);
        }
        .audio-btn.secondary:hover {
            background: #fff;
            border-color: #8bc34a;
            transform: translateY(-2px);
        }
        .audio-btn .icon {
            font-size: 1.1rem;
        }
        /* ===== 选项 ===== */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin: 14px 0 10px;
        }
        .option-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid rgba(180, 200, 140, 0.3);
            border-radius: 40px;
            padding: 14px 12px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a3a0a;
            cursor: pointer;
            transition: all 0.18s ease;
            text-align: center;
            user-select: none;
            position: relative;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .option-card .letter {
            background: rgba(180, 200, 140, 0.2);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: #3a6b2a;
            flex-shrink: 0;
        }
        .option-card:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: #8bc34a;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 24px rgba(139, 195, 74, 0.10);
        }
        .option-card.selected {
            border-color: #8bc34a;
            background: rgba(139, 195, 74, 0.10);
        }
        .option-card.correct {
            border-color: #66bb6a;
            background: rgba(102, 187, 106, 0.18);
            color: #1a6a2a;
        }
        .option-card.wrong {
            border-color: #ef5350;
            background: rgba(239, 83, 80, 0.12);
            color: #a33a3a;
        }
        .option-card.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .option-card .check-mark {
            font-size: 1.3rem;
        }
        /* ===== 底部按钮 ===== */
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 14px;
        }
        .action-btn {
            padding: 10px 30px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn:active {
            transform: scale(0.94);
        }
        .action-btn.next {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            box-shadow: 0 4px 20px rgba(139, 195, 74, 0.2);
        }
        .action-btn.next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(139, 195, 74, 0.25);
        }
        .action-btn.next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .action-btn.reset {
            background: rgba(180, 200, 140, 0.25);
            color: #3a6b2a;
            border: 1px solid rgba(180, 200, 140, 0.2);
        }
        .action-btn.reset:hover {
            background: rgba(180, 200, 140, 0.4);
            transform: translateY(-2px);
        }
        /* ===== PK 模式 ===== */
        .pk-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .pk-players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }
        .pk-player-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 14px 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.25s;
            position: relative;
        }
        .pk-player-card .pname {
            font-weight: 700;
            font-size: 0.85rem;
            color: #2a4a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .pk-player-card .pname .pscore {
            background: linear-gradient(135deg, #ffb74d, #ff8a65);
            color: #fff;
            padding: 0 14px;
            border-radius: 30px;
            font-size: 0.8rem;
        }
        .pk-player-card .pk-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin: 6px 0 4px;
        }
        .pk-player-card .pk-opt {
            background: rgba(255, 255, 255, 0.5);
            border: 1.5px solid rgba(180, 200, 140, 0.3);
            border-radius: 30px;
            padding: 8px 4px;
            font-size: 0.72rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            color: #1a3a0a;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }
        .pk-player-card .pk-opt:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.85);
            border-color: #8bc34a;
        }
        .pk-player-card .pk-opt.selected {
            border-color: #8bc34a;
            background: rgba(139, 195, 74, 0.12);
        }
        .pk-player-card .pk-opt.correct {
            border-color: #66bb6a;
            background: rgba(102, 187, 106, 0.18);
            color: #1a6a2a;
        }
        .pk-player-card .pk-opt.wrong {
            border-color: #ef5350;
            background: rgba(239, 83, 80, 0.12);
            color: #a33a3a;
        }
        .pk-player-card .pk-opt.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .pk-player-card .pk-status {
            font-size: 0.65rem;
            color: #5a7a4a;
            margin-top: 4px;
            text-align: center;
        }
        .pk-player-card .remove-pk {
            position: absolute;
            top: 6px;
            right: 10px;
            background: rgba(239, 83, 80, 0.10);
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            cursor: pointer;
            color: #a03a3a;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pk-player-card .remove-pk:hover {
            background: rgba(239, 83, 80, 0.2);
            transform: scale(1.08);
        }
        .pk-player-card.flash-correct {
            background: rgba(102, 187, 106, 0.15) !important;
            border-color: #66bb6a;
        }
        .pk-player-card.flash-wrong {
            background: rgba(239, 83, 80, 0.10) !important;
            border-color: #ef5350;
        }
        .pk-player-card .pk-progress {
            font-size: 0.6rem;
            color: #5a7a4a;
            text-align: center;
            margin-top: 2px;
        }
        /* PK 控制栏 */
        .pk-control-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            padding: 12px 0 4px;
            border-top: 1px solid rgba(180, 200, 140, 0.15);
            margin-top: 8px;
        }
        .pk-control-bar label {
            font-weight: 600;
            color: #3a6b2a;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pk-control-bar input[type="number"] {
            width: 56px;
            padding: 5px 8px;
            border-radius: 30px;
            border: 1px solid rgba(180, 200, 140, 0.3);
            font-weight: 600;
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
        }
        .pk-control-bar input[type="number"]:focus {
            border-color: #8bc34a;
            box-shadow: 0 0 0 3px rgba(139, 195, 74, 0.10);
        }
        .pk-control-bar .pk-btn {
            padding: 7px 22px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.78rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .pk-control-bar .pk-btn.start {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            box-shadow: 0 4px 16px rgba(139, 195, 74, 0.2);
        }
        .pk-control-bar .pk-btn.start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 195, 74, 0.25);
        }
        .pk-control-bar .pk-btn.start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .pk-control-bar .pk-btn.reset-pk {
            background: rgba(180, 200, 140, 0.2);
            color: #3a6b2a;
            border: 1px solid rgba(180, 200, 140, 0.15);
        }
        .pk-control-bar .pk-btn.reset-pk:hover {
            background: rgba(180, 200, 140, 0.35);
            transform: translateY(-2px);
        }
        .pk-control-bar .pk-btn.add-player {
            background: rgba(255, 215, 150, 0.25);
            color: #8a7a3a;
            border: 1px solid rgba(255, 215, 150, 0.2);
        }
        .pk-control-bar .pk-btn.add-player:hover {
            background: rgba(255, 215, 150, 0.4);
            transform: translateY(-2px);
        }
        /* ===== 排行榜 ===== */
        .rank-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 60, 20, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .rank-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 30px 28px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
        }
        .rank-card h2 {
            color: #2a4a1a;
            margin-bottom: 14px;
            font-size: 1.4rem;
        }
        .rank-list {
            text-align: left;
            margin: 14px 0;
        }
        .rank-item {
            padding: 7px 14px;
            border-bottom: 1px solid rgba(180, 200, 140, 0.2);
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            color: #2a4a1a;
        }
        .rank-item .rank-pos {
            font-weight: 700;
            color: #8bc34a;
        }
        .rank-close {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .rank-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 195, 74, 0.2);
        }
        /* ===== 礼花 ===== */
        .firework-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }
        /* ===== 响应式 ===== */
        @media (max-width: 720px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header-controls {
                flex-wrap: wrap;
                justify-content: center;
            }
            .header-controls .ctrl-group {
                width: 100%;
            }
            .header-controls select,
            .header-controls .mode-btn {
                width: 100%;
            }
            .mode-toggle-group {
                width: 100%;
                justify-content: center;
            }
            .info-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                gap: 4px;
            }
            .info-item {
                justify-content: center;
            }
            .listening-area {
                padding: 14px 16px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .pk-players-grid {
                grid-template-columns: 1fr;
            }
            .pk-player-card .pk-options {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .main-content {
                padding: 10px 12px 16px;
            }
            .audio-btn {
                padding: 7px 18px;
                font-size: 0.8rem;
            }
            .action-btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }
            .option-card .letter {
                width: 26px;
                height: 26px;
                font-size: 0.65rem;
            }
            .option-card {
                padding: 10px 8px;
                min-height: 50px;
                font-size: 0.95rem;
            }
        }
        @media (max-width: 480px) {
            .app-container {
                border-radius: 28px;
            }
            .logo {
                font-size: 1rem;
            }
            .pk-player-card .pk-options {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 4px;
            }
            .pk-player-card .pk-opt {
                font-size: 0.6rem;
                padding: 6px 2px;
                min-height: 34px;
            }
        }
        /* ===== 工具 ===== */
        .hidden {
            display: none !important;
        }
        .text-muted {
            color: #5a7a4a;
            font-size: 0.8rem;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* ==============================================================
                   iOS 26 高级渲染 (通过 data-glass 开启)
                   ============================================================== */
        [data-glass="enabled"] body {
            background: radial-gradient(circle at 20% 25%, #e8f5e9, #c8e6c9 60%, #a5d6a7 100%);
        }
        [data-glass="enabled"] .app-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);

            <div id="singleMode" class="single-mode">

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getWords(grade, book, unit) {
            return wordBank[grade]?.[book]?.[unit] || [];
        }

        function getUnits(grade, book) {
            const data = wordBank[grade]?.[book];
            return data ? Object.keys(data).sort() : [];
        }

        function pickOptions(correct, pool, count = 3) {
            const others = pool.filter(w => w.word !== correct);
            const shuffled = shuffle([...others]);
            const selected = [correct, ...shuffled.slice(0, count - 1).map(w => w.word)];
            while (selected.length < count) {
                const fallback = ['apple', 'book', 'cat', 'dog', 'fish', 'school', 'teacher', 'student'];
                for (const f of fallback) {
                    if (!selected.includes(f)) { selected.push(f); break; }
                }
                if (selected.length >= count) break;
            }
            return shuffle(selected);
        }

        function getAudioUrl(word) {
            return `./audio/${encodeURIComponent(word)}.mp3`;
        }

        // ================================================================
        //  3. 音效 & 礼花
        // ================================================================
        const sfx = {
            ctx: null,
            playTone(freq, dur, type = 'sine', vol = 0.2) {
                try {
                    if (!this.ctx) this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.value = vol;
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                    osc.stop(this.ctx.currentTime + dur);
                } catch (_) {}
            },
            correct() { this.playTone(880, 0.10);
                setTimeout(() => this.playTone(1108, 0.14), 90); },
            wrong() { this.playTone(280, 0.2, 'sawtooth', 0.12); },
            next() { this.playTone(660, 0.07); },
            cheer() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.playTone(f, 0.16), i * 110)); },
            reset() { this.playTone(440, 0.08);
                setTimeout(() => this.playTone(554, 0.08), 70); },
            playStart() { this.playTone(880, 0.06);
                setTimeout(() => this.playTone(1108, 0.06), 70); }
        };

                this.x = x;
                this.y = y;
                const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#ff8a5c', '#a29bfe', '#8bc34a'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = 3 + Math.random() * 4;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8 - 2;
                this.gravity = 0.15;
                this.alpha = 1;
                this.decay = 0.015 + Math.random() * 0.025;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }
            draw() {
                fwCtx.globalAlpha = this.alpha;
                fwCtx.fillStyle = this.color;
                fwCtx.beginPath();
                fwCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                fwCtx.fill();
                fwCtx.globalAlpha = 1;
            }
        }

        function firework(x, y) {
            for (let i = 0; i < 60; i++) fwParticles.push(new FwParticle(x, y));
            if (!fwAnimId) fwAnimId = requestAnimationFrame(animateFw);
        }

        function animateFw() {
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            let alive = false;
            for (const p of fwParticles) {
                if (p.update()) { alive = true;
                    p.draw(); }
            }
            fwParticles = fwParticles.filter(p => p.alpha > 0);
            if (alive) fwAnimId = requestAnimationFrame(animateFw);
            else { fwAnimId = null;
                fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height); }
        }

        function showFirework(el) {
            if (!el) return;
            const r = el.getBoundingClientRect();
            firework(r.left + r.width / 2, r.top + r.height / 3);
        }

        // ================================================================
        //  4. 音频引擎 (支持 MP3 + TTS 降级)
        // ================================================================
        const AudioEngine = {
            audio: null,
            isPlaying: false,
            word: '',
            useTTS: false,
            ttsCache: new Map(),

            // 检测音频文件是否存在
            checkAudioFile(word) {
                return new Promise((resolve) => {
                    const url = getAudioUrl(word);
                    const audio = new Audio();
                    audio.preload = 'none';
                    const timeout = setTimeout(() => {
                        audio.src = '';
                        resolve(false);
                    }, 2000);
                    audio.oncanplaythrough = () => {
                        clearTimeout(timeout);
                        audio.src = '';
                        resolve(true);
                    };
                    audio.onerror = () => {
                        clearTimeout(timeout);
                        audio.src = '';
                        resolve(false);
                    };
                    audio.src = url;
                    audio.load();
                });
            },

            // 播放 (返回 Promise)
            play(word, onStart, onEnd) {
                return new Promise(async (resolve) => {
                    this.stop();
                    this.word = word;

                    // 检查是否有可用 MP3
                    const hasFile = await this.checkAudioFile(word);
                    if (hasFile) {
                        this.useTTS = false;
                        this.audio = new Audio(getAudioUrl(word));
                        this.audio.oncanplaythrough = () => {
                            if (onStart) onStart();
                        };
                        this.audio.onended = () => {
                            this.isPlaying = false;
                            if (onEnd) onEnd();
                            resolve();
                        };
                        this.audio.onerror = () => {
                            // MP3 加载失败，降级到 TTS
                            this.isPlaying = false;
                            this.playTTS(word, onStart, onEnd).then(resolve);
                        };
                        this.audio.play().catch(() => {
                            this.isPlaying = false;
                            this.playTTS(word, onStart, onEnd).then(resolve);
                        });
                        this.isPlaying = true;
                    } else {
                        // 使用 TTS
                        this.playTTS(word, onStart, onEnd).then(resolve);
                    }
                });
            },

            // TTS 降级
            playTTS(word, onStart, onEnd) {
                return new Promise((resolve) => {
                    this.useTTS = true;
                    if (!window.speechSynthesis) {
                        if (onEnd) onEnd();
                        resolve();
                        return;
                    }
                    // 取消任何正在进行的语音
                    window.speechSynthesis.cancel();

                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    utterance.volume = 1.0;

                    // 尝试选择英语语音
                    const voices = window.speechSynthesis.getVoices();
                    const enVoice = voices.find(v => v.lang.startsWith('en'));
                    if (enVoice) utterance.voice = enVoice;

                    utterance.onstart = () => {
                        this.isPlaying = true;
                        if (onStart) onStart();
                    };
                    utterance.onend = () => {
                        this.isPlaying = false;
                        if (onEnd) onEnd();
                        resolve();
                    };
                    utterance.onerror = () => {
                        this.isPlaying = false;
                        if (onEnd) onEnd();
                        resolve();
                    };
                    window.speechSynthesis.speak(utterance);
                });
            },

            stop() {
                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                    this.audio = null;
                }
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                this.isPlaying = false;
            },

            isPlayingNow() {
                return this.isPlaying;
            }
        };

        // 预加载语音列表
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

            selectOption(idx) {
                if (STATE.single.answered || STATE.single.audioLock) return;
                const cards = singleOptions.querySelectorAll('.option-card');
                const selectedWord = cards[idx].dataset.word;
                const correct = STATE.single.correctWord;
                const isCorrect = selectedWord === correct;

                STATE.single.answered = true;
                STATE.single.selectedIdx = idx;

                // 立即截停录音
                AudioEngine.stop();
                STATE.single.isPlaying = false;
                STATE.single.audioLock = false;
                singlePlayBtn.disabled = false;
                singleReplayBtn.disabled = true;

                cards.forEach((el, i) => {
                    el.classList.add('disabled');
                    const w = el.dataset.word;
                    if (w === correct) {
                        el.classList.add('correct');
                        el.querySelector('.check-mark').textContent = '✅';
                    } else if (i === idx && !isCorrect) {
                        el.classList.add('wrong');
                        el.querySelector('.check-mark').textContent = '❌';
                    }
                    if (i === idx) el.classList.add('selected');
                });

                if (isCorrect) {
                    STATE.single.score += 2;
                    sfx.correct();
                    singleStatus.textContent = '✅ 答对了！ +2分';
                    singleStatus.className = 'status-badge correct';
                } else {
                    sfx.wrong();
                    singleStatus.textContent = `❌ 正确答案是 “${correct}”`;
                    singleStatus.className = 'status-badge wrong';
                }

                this.updateUI();
                singleNextBtn.disabled = false;
                singleReplayBtn.disabled = true;
            },

            playAudio() {
                if (STATE.single.audioLock) return;
                const words = STATE.single.words;
                const idx = STATE.single.index;
                if (idx >= words.length) return;
                if (STATE.single.isPlaying) return;
                const word = words[idx].word;

                STATE.single.audioLock = true;
                STATE.single.isPlaying = true;
                singlePlayBtn.disabled = true;
                singleReplayBtn.disabled = true;
                singleStatus.textContent = '🔊 播放中 ...';
                singleStatus.className = 'status-badge playing';

                // 播放一次
                AudioEngine.play(word,
                    () => {
                        // 开始播放
                    },
                    () => {
                        // 播放结束
                        STATE.single.isPlaying = false;
                        STATE.single.audioLock = false;
                        singlePlayBtn.disabled = false;
                        singleReplayBtn.disabled = false;
                        if (!STATE.single.answered) {
                            singleStatus.textContent = '🔊 播放完毕，请选择答案';
                            singleStatus.className = 'status-badge done';
                            STATE.single.played = true;
                        } else {
                            singleStatus.textContent = '✅ 已作答';
                            singleStatus.className = 'status-badge correct';
                        }
                    }
                );
            },

            replayAudio() {
                if (STATE.single.audioLock) return;
                if (STATE.single.answered) return;
                const words = STATE.single.words;
                const idx = STATE.single.index;
                if (idx >= words.length) return;
                const word = words[idx].word;

                STATE.single.audioLock = true;
                STATE.single.isPlaying = true;
                singlePlayBtn.disabled = true;
                singleReplayBtn.disabled = true;
                singleStatus.textContent = '🔊 再听一次 ...';
                singleStatus.className = 'status-badge playing';

                AudioEngine.play(word,
                    () => {},
                    () => {
                        STATE.single.isPlaying = false;
                        STATE.single.audioLock = false;
                        singlePlayBtn.disabled = false;
                        singleReplayBtn.disabled = false;
                        if (!STATE.single.answered) {
                            singleStatus.textContent = '🔊 播放完毕，请选择答案';
                            singleStatus.className = 'status-badge done';
                        }
                    }
                );
            },

            next() {
                if (!STATE.single.answered) return;
                STATE.single.index++;
                if (STATE.single.index >= STATE.single.words.length) {
                    this.renderQuestion();
                    singleStatus.textContent = '🎉 全部完成！';
                    singleStatus.className = 'status-badge done';
                    singlePlayBtn.disabled = true;
                    singleReplayBtn.disabled = true;

                singleStatus.textContent = '🎧 点击「开始练习」听录音选词';
                singleStatus.className = 'status-badge';
                singleReplayBtn.disabled = true;

            reset() {

                this.loadWords();

                STATE.pk.currentQuestion = 0;
                STATE.pk.isActive = false;

                STATE.pk.played = false;
                STATE.pk.audioLock = false;
                STATE.pk.roundFinished = false;
                STATE.pk.wordList = [];
                STATE.pk.options = [];
                STATE.pk.correctWord = '';
                for (const p of STATE.pk.players) {
                    p.score = 0;
                    p.answered = false;
                    p.selectedIdx = -1;
                    p.done = false;
                }
                this.updateUI();
                this.renderPlayers();
                pkStatus.textContent = '🎧 等待开始';
                pkStatus.className = 'status-badge';
                pkPlayBtn.disabled = true;
                pkReplayBtn.disabled = true;
                pkTargetDisplay.textContent = STATE.pk.totalQuestions * 2;
                pkStartBtn.disabled = false;
            },

            loadWords() {
                const all = getWords(STATE.grade, STATE.book, STATE.unit);
                const valid = all.filter(w => w.word && w.word.trim().length > 0);
                STATE.pk.wordList = shuffle([...valid]);
                const total = STATE.pk.totalQuestions;
                if (STATE.pk.wordList.length > total) {
                    STATE.pk.wordList = STATE.pk.wordList.slice(0, total);
                }
                STATE.pk.currentQuestion = 0;
                for (const p of STATE.pk.players) {
                    p.score = 0;
                    p.answered = false;
                    p.selectedIdx = -1;
                    p.done = false;
                }
                this.updateUI();
                this.renderPlayers();
            },

            renderPlayers() {
                const players = STATE.pk.players;
                if (players.length === 0) {
                    pkPlayersGrid.innerHTML =
                        `<div style="grid-column:1/-1; text-align:center; padding:20px; color:#5a7a4a;">👥 点击「添加玩家」开始</div>`;
                    return;
                }
                let html = '';
                for (const p of players) {
                    const progress = p.done ? '✅ 完成' : `${Math.min(p.score / 2, STATE.pk.totalQuestions)}/${STATE.pk.totalQuestions}`;
                    html += `
                        <div class="pk-player-card" data-pid="${p.id}">
                            <button class="remove-pk" data-pid="${p.id}">✕</button>
                            <div class="pname">
                                <span>🧑‍🎓 玩家 ${p.id}</span>
                                <span class="pscore">${p.score} 分</span>
                            </div>
                            <div class="pk-options" data-pid="${p.id}">
                                <div class="pk-opt disabled" data-idx="0">-</div>
                                <div class="pk-opt disabled" data-idx="1">-</div>
                                <div class="pk-opt disabled" data-idx="2">-</div>
                            </div>
                            <div class="pk-status">${p.answered ? '✅ 已答' : '⏳ 等待'}</div>
                            <div class="pk-progress">${progress}</div>
                        </div>
                    `;
                }
                pkPlayersGrid.innerHTML = html;

                pkPlayersGrid.querySelectorAll('.remove-pk').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = parseInt(btn.dataset.pid);
                        this.removePlayer(id);
                    });
                });
            },

            renderQuestionForPlayers() {
                const players = STATE.pk.players;
                const opts = STATE.pk.options;
                const letters = ['A', 'B', 'C'];
                const isActive = STATE.pk.isActive && !STATE.pk.roundFinished;

                for (const p of players) {
                    const container = pkPlayersGrid.querySelector(`.pk-options[data-pid="${p.id}"]`);
                    if (!container) continue;
                    let html = '';
                    for (let i = 0; i < opts.length; i++) {
                        const word = opts[i] || '---';
                        const cls = 'pk-opt' + (isActive && !p.answered && !p.done ? '' : ' disabled');
                        const mark = (p.answered && p.selectedIdx === i) ? (p.selectedIdx === i && opts[i] === STATE.pk
                            .correctWord ? ' ✅' : (p.selectedIdx === i ? ' ❌' : '')) : '';
                        html += `<div class="${cls}" data-idx="${i}" data-word="${word}">${letters[i]}. ${word}${mark}</div>`;
                    }
                    container.innerHTML = html;

                    if (isActive && !p.answered && !p.done) {
                        container.querySelectorAll('.pk-opt').forEach(el => {
                            el.addEventListener('click', () => {
                                if (!STATE.pk.isActive || STATE.pk.roundFinished) return;
                                if (p.answered || p.done) return;
                                const idx = parseInt(el.dataset.idx);
                                this.playerSelect(p.id, idx);
                            });
                        });
                    }

                    // 状态
                    const statusEl = container.closest('.pk-player-card').querySelector('.pk-status');
                    if (statusEl) {
                        if (p.done) statusEl.textContent = '🏁 已完成';
                        else if (p.answered) statusEl.textContent = '✅ 已答';
                        else statusEl.textContent = isActive ? '⏳ 思考中' : '⏳ 等待';
                    }
                    const scoreEl = container.closest('.pk-player-card').querySelector('.pscore');
                    if (scoreEl) scoreEl.textContent = p.score + ' 分';

                    // 进度
                    const progEl = container.closest('.pk-player-card').querySelector('.pk-progress');
                    if (progEl) {
                        const done = Math.min(p.score / 2, STATE.pk.totalQuestions);
                        progEl.textContent = p.done ? '✅ 完成' : `${done}/${STATE.pk.totalQuestions}`;
                    }
                }
            },

            playerSelect(playerId, optIdx) {
                if (STATE.pk.roundFinished) return;
                const p = STATE.pk.players.find(p => p.id === playerId);
                if (!p || p.answered || p.done || !STATE.pk.isActive) return;
                const correct = STATE.pk.correctWord;
                const selectedWord = STATE.pk.options[optIdx] || '';
                const isCorrect = selectedWord === correct;

                p.answered = true;
                p.selectedIdx = optIdx;

                if (isCorrect) {
                    p.score += 2;
                    sfx.correct();
                    const card = pkPlayersGrid.querySelector(`.pk-player-card[data-pid="${p.id}"]`);
                    if (card) {
                        card.classList.add('flash-correct');
                        setTimeout(() => card.classList.remove('flash-correct'), 500);
                        showFirework(card);
                    }
                } else {
                    sfx.wrong();
                    const card = pkPlayersGrid.querySelector(`.pk-player-card[data-pid="${p.id}"]`);
                    if (card) {
                        card.classList.add('flash-wrong');
                        setTimeout(() => card.classList.remove('flash-wrong'), 500);
                    }
                }

                // 更新UI
                const container = pkPlayersGrid.querySelector(`.pk-options[data-pid="${p.id}"]`);
                if (container) {
                    container.querySelectorAll('.pk-opt').forEach((el, i) => {
                        el.classList.add('disabled');
                        const w = el.dataset.word;
                        let suffix = '';
                        if (w === correct) suffix = ' ✅';
                        else if (i === optIdx && !isCorrect) suffix = ' ❌';
                        if (i === optIdx) {
                            el.classList.add('selected');
                            if (isCorrect) el.classList.add('correct');
                            else el.classList.add('wrong');
                        }
                        if (w === correct && i !== optIdx) {
                            el.classList.add('correct');
                        }
                        el.textContent = el.textContent.replace(/[✅❌]/g, '') + suffix;
                    });
                    const statusEl = container.closest('.pk-player-card').querySelector('.pk-status');
                    if (statusEl) statusEl.textContent = isCorrect ? '✅ +2分' : '❌ 答错';
                }
                const scoreEl = pkPlayersGrid.querySelector(`.pk-player-card[data-pid="${p.id}"] .pscore`);
                if (scoreEl) scoreEl.textContent = p.score + ' 分';

                // 检查是否所有玩家都已答完或完成
                const allDone = STATE.pk.players.every(p => p.answered || p.done);
                if (allDone) {
                    this.roundFinished = true;
                    // 检查是否有玩家达到目标
                    const target = STATE.pk.totalQuestions * 2;
                    const winner = STATE.pk.players.find(p => p.score >= target);
                    if (winner) {
                        this.endPK(winner);
                        return;
                    }
                    // 检查是否所有玩家都已完成所有题目
                    const allCompleted = STATE.pk.players.every(p => p.score / 2 >= STATE.pk.totalQuestions);
                    if (allCompleted) {
                        const sorted = [...STATE.pk.players].sort((a, b) => b.score - a.score);
                        this.endPK(sorted[0], sorted);
                        return;
                    }
                    // 进入下一题
                    setTimeout(() => {
                        if (STATE.pk.isActive) {
                            this.nextQuestion();
                        }
                    }, 1000);
                }
            },

            nextQuestion() {
                const words = STATE.pk.wordList;
                const idx = STATE.pk.currentQuestion + 1;
                if (idx >= words.length) {
                    // 所有题目用完，按分数排名
                    const sorted = [...STATE.pk.players].sort((a, b) => b.score - a.score);
                    this.endPK(sorted[0], sorted);
                    return;
                }
                STATE.pk.currentQuestion = idx;
                STATE.pk.roundFinished = false;
                for (const p of STATE.pk.players) {
                    p.answered = false;
                    p.selectedIdx = -1;
                }
                this.loadQuestion(idx);
            },

            loadQuestion(idx) {
                const words = STATE.pk.wordList;
                if (idx >= words.length) return;
                const word = words[idx];
                const pool = words;
                const opts = pickOptions(word.word, pool, 3);
                STATE.pk.options = opts;
                STATE.pk.correctWord = word.word;
                STATE.pk.roundFinished = false;

                for (const p of STATE.pk.players) {
                    p.answered = false;
                    p.selectedIdx = -1;
                }

                this.updateUI();
                this.renderQuestionForPlayers();
                pkStatus.textContent = `🎧 第 ${idx+1}/${words.length} 题，听录音选词`;
                pkStatus.className = 'status-badge';
                pkPlayBtn.disabled = false;
                pkReplayBtn.disabled = true;
                pkStartBtn.disabled = true;
                STATE.pk.played = false;
                STATE.pk.isPlaying = false;
                STATE.pk.audioLock = false;
            },

            playAudio() {
                if (STATE.pk.audioLock) return;
                const words = STATE.pk.wordList;
                const idx = STATE.pk.currentQuestion;
                if (idx >= words.length) return;
                if (STATE.pk.isPlaying) return;
                const word = words[idx].word;

                STATE.pk.audioLock = true;
                STATE.pk.isPlaying = true;
                pkPlayBtn.disabled = true;
                pkReplayBtn.disabled = true;
                pkStatus.textContent = '🔊 播放中 ...';
                pkStatus.className = 'status-badge playing';

                // 播放一次
                AudioEngine.play(word,
                    () => {},
                    () => {
                        STATE.pk.isPlaying = false;
                        STATE.pk.audioLock = false;
                        pkPlayBtn.disabled = false;
                        pkReplayBtn.disabled = false;
                        if (!STATE.pk.roundFinished) {
                            pkStatus.textContent = '🔊 播放完毕，请选择答案';
                            pkStatus.className = 'status-badge done';
                            STATE.pk.played = true;
                            // 启用选项
                            pkPlayersGrid.querySelectorAll('.pk-opt').forEach(el => {
                                if (!el.classList.contains('disabled')) {
                                    // 不自动启用，由render控制
                                }
                            });
                            this.renderQuestionForPlayers();
                        }
                    }
                );
            },

            replayAudio() {
                if (STATE.pk.audioLock) return;
                if (STATE.pk.roundFinished) return;
                const words = STATE.pk.wordList;
                const idx = STATE.pk.currentQuestion;
                if (idx >= words.length) return;
                const word = words[idx].word;

                STATE.pk.audioLock = true;
                STATE.pk.isPlaying = true;
                pkPlayBtn.disabled = true;
                pkReplayBtn.disabled = true;
                pkStatus.textContent = '🔊 再听一次 ...';
                pkStatus.className = 'status-badge playing';

                AudioEngine.play(word,
                    () => {},
                    () => {
                        STATE.pk.isPlaying = false;
                        STATE.pk.audioLock = false;
                        pkPlayBtn.disabled = false;
                        pkReplayBtn.disabled = false;
                        if (!STATE.pk.roundFinished) {
                            pkStatus.textContent = '🔊 播放完毕，请选择答案';
                            pkStatus.className = 'status-badge done';
                            this.renderQuestionForPlayers();
                        }
                    }
                );
            },

            start() {
                const total = parseInt(pkTotalInput.value) || 10;
                STATE.pk.totalQuestions = Math.min(Math.max(total, 1), 50);
                pkTotalInput.value = STATE.pk.totalQuestions;
                pkTargetDisplay.textContent = STATE.pk.totalQuestions * 2;

                if (STATE.pk.players.length < 2) {
                    pkStatus.textContent = '⚠️ 至少需要 2 位玩家';
                    pkStatus.className = 'status-badge';
                    return;
                }

                AudioEngine.stop();
                STATE.pk.isActive = true;
                STATE.pk.currentQuestion = 0;
                STATE.pk.roundFinished = false;
                for (const p of STATE.pk.players) {
                    p.score = 0;
                    p.answered = false;
                    p.selectedIdx = -1;
                    p.done = false;
                }
                this.loadWords();
                this.loadQuestion(0);
                pkStartBtn.disabled = true;
                pkStatus.textContent = '🎧 点击「开始对局」听录音';
                pkStatus.className = 'status-badge';
                pkPlayBtn.disabled = false;
                pkReplayBtn.disabled = true;
                sfx.playStart();
            },

            reset() {
                AudioEngine.stop();
                STATE.pk.isActive = false;
                STATE.pk.isPlaying = false;
                STATE.pk.audioLock = false;
                STATE.pk.roundFinished = false;
                for (const p of STATE.pk.players) {
                    p.score = 0;
                    p.answered = false;
                    p.selectedIdx = -1;
                    p.done = false;
                }
                const total = parseInt(pkTotalInput.value) || 10;
                STATE.pk.totalQuestions = Math.min(Math.max(total, 1), 50);
                pkTotalInput.value = STATE.pk.totalQuestions;
                pkTargetDisplay.textContent = STATE.pk.totalQuestions * 2;
                pkStartBtn.disabled = false;
                pkPlayBtn.disabled = true;
                pkReplayBtn.disabled = true;
                pkStatus.textContent = '🔄 已重置';
                pkStatus.className = 'status-badge';
                this.loadWords();
                this.renderPlayers();
                pkPlayersGrid.querySelectorAll('.pk-opt').forEach(el => {
                    el.textContent = '-';
                    el.className = 'pk-opt disabled';
                });
                pkPlayersGrid.querySelectorAll('.pk-status').forEach(el => el.textContent = '⏳ 等待');
                pkPlayersGrid.querySelectorAll('.pk-progress').forEach(el => el.textContent = '0/0');
                sfx.reset();
            },

            endPK(winner, allSorted) {
                STATE.pk.isActive = false;
                STATE.pk.roundFinished = true;
                pkPlayBtn.disabled = true;
                pkReplayBtn.disabled = true;
                pkStartBtn.disabled = false;

                sfx.cheer();

                const sorted = allSorted || [...STATE.pk.players].sort((a, b) => b.score - a.score);
                let rankHtml = '';
                for (let i = 0; i < sorted.length; i++) {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                    rankHtml += `<div class="rank-item"><span class="rank-pos">${medal}</span> 玩家 ${sorted[i].id} <span>${sorted[i].score} 分</span></div>`;
                }

                const modal = document.createElement('div');
                modal.className = 'rank-modal';
                modal.innerHTML = `
                    <div class="rank-card">
                        <h2>🏆 对局结束 🏆</h2>
                        <div class="rank-list">${rankHtml}</div>
                        <button class="rank-close">👏 太棒了！</button>
                    </div>
                `;
                document.body.appendChild(modal);
                modal.querySelector('.rank-close').addEventListener('click', () => {
                    modal.remove();
                    const winnerCard = pkPlayersGrid.querySelector(`.pk-player-card[data-pid="${winner.id}"]`);
                    if (winnerCard) showFirework(winnerCard);
                });

                pkStatus.textContent = `🏆 ${winner.id}号玩家 获胜！`;
                pkStatus.className = 'status-badge done';
            },

            addPlayer() {
                if (STATE.pk.players.length >= 8) return;
                const id = STATE.pk.playerIdCounter++;
                STATE.pk.players.push({
                    id,
                    score: 0,
                    answered: false,
                    selectedIdx: -1,
                    done: false,
                });
                this.renderPlayers();
                if (STATE.pk.isActive && !STATE.pk.roundFinished) {
                    this.renderQuestionForPlayers();
                } else {
                    pkPlayersGrid.querySelectorAll('.pk-opt').forEach(el => {
                        el.textContent = '-';
                        el.className = 'pk-opt disabled';
                    });
                    pkPlayersGrid.querySelectorAll('.pk-status').forEach(el => el.textContent = '⏳ 等待');
                    pkPlayersGrid.querySelectorAll('.pk-progress').forEach(el => el.textContent = '0/0');
                }
                this.updateUI();
                sfx.next();
            },

            removePlayer(id) {
                if (STATE.pk.players.length <= 2) return;
                const idx = STATE.pk.players.findIndex(p => p.id === id);
                if (idx === -1) return;
                STATE.pk.players.splice(idx, 1);
                if (STATE.pk.isActive) {
                    STATE.pk.isActive = false;
                    STATE.pk.roundFinished = true;
                    AudioEngine.stop();
                }
                this.renderPlayers();
                if (!STATE.pk.isActive) {
                    pkPlayersGrid.querySelectorAll('.pk-opt').forEach(el => {
                        el.textContent = '-';
                        el.className = 'pk-opt disabled';
                    });
                    pkPlayersGrid.querySelectorAll('.pk-status').forEach(el => el.textContent = '⏳ 等待');
                    pkPlayersGrid.querySelectorAll('.pk-progress').forEach(el => el.textContent = '0/0');
                }
                this.updateUI();
                sfx.reset();
            },

            updateUI() {
                const total = STATE.pk.totalQuestions;
                const done = Math.min(STATE.pk.currentQuestion + 1, total);
                pkProgress.textContent = `${STATE.pk.currentQuestion + (STATE.pk.isActive ? 1 : 0)}/${total}`;
                pkTargetDisplay.textContent = total * 2;
            }
        };

        // ================================================================
        //  9. 模式切换 & 年级/单元联动
        // ================================================================
        function switchMode(mode) {
            STATE.mode = mode;
            if (mode === 'single') {
                singleMode.style.display = 'block';
                pkMode.style.display = 'none';
                modeSingleBtn.classList.add('active');
                modePkBtn.classList.remove('active');
                AudioEngine.stop();
                STATE.pk.isActive = false;
                Single.loadWords();
            } else {
                singleMode.style.display = 'none';
                pkMode.style.display = 'block';
                modeSingleBtn.classList.remove('active');
                modePkBtn.classList.add('active');
                AudioEngine.stop();
                STATE.single.isPlaying = false;
                if (STATE.pk.players.length === 0) {
                    STATE.pk.playerIdCounter = 1;
                    STATE.pk.players = [];
                    PK.addPlayer();
                    PK.addPlayer();
                }
                PK.init();
                PK.loadWords();
                pkPlayBtn.disabled = true;
                pkReplayBtn.disabled = true;
            }
            sfx.next();
        }

        function populateGrades() {
            const grades = Object.keys(wordBank);
            gradeSelect.innerHTML = grades.map(g => `<option value="${g}">${g}年级</option>`).join('');
            gradeSelect.value = STATE.grade;
            updateUnits();
        }

        function updateUnits() {
            const units = getUnits(STATE.grade, STATE.book);
            unitSelect.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');
            if (units.length) {
                STATE.unit = units[0];
                unitSelect.value = STATE.unit;
            }
            onUnitChange();
        }

        function onUnitChange() {
            STATE.grade = gradeSelect.value;
            STATE.book = bookSelect.value;
            STATE.unit = unitSelect.value;
            if (STATE.mode === 'single') {
                Single.loadWords();
            } else {
                PK.init();
                PK.loadWords();
                pkPlayBtn.disabled = true;
                pkReplayBtn.disabled = true;
            }
            sfx.next();
        }

        // ================================================================
        //  10. 高级渲染 (iOS 26 风格)
        // ================================================================
        function toggleGlass() {
            STATE.glass = !STATE.glass;
            if (STATE.glass) {
                document.documentElement.setAttribute('data-glass', 'enabled');
                glassToggleBtn.textContent = '💎 高级渲染 (开)';
                glassToggleBtn.style.background = 'rgba(139,195,74,0.2)';
                glassToggleBtn.style.borderColor = '#8bc34a';
            } else {
                document.documentElement.removeAttribute('data-glass');
                glassToggleBtn.textContent = '💎 高级渲染';
                glassToggleBtn.style.background = 'rgba(255,255,255,0.3)';
                glassToggleBtn.style.borderColor = 'rgba(180,200,140,0.2)';
            }
            localStorage.setItem('glassEnabled', STATE.glass ? 'true' : 'false');
        }

        // 恢复玻璃状态
        const savedGlass = localStorage.getItem('glassEnabled');
        if (savedGlass === 'true') {
            STATE.glass = true;
            document.documentElement.setAttribute('data-glass', 'enabled');
            glassToggleBtn.textContent = '💎 高级渲染 (开)';
            glassToggleBtn.style.background = 'rgba(139,195,74,0.2)';
            glassToggleBtn.style.borderColor = '#8bc34a';
        }

        // ================================================================
        //  11. 事件绑定
        // ================================================================
        gradeSelect.addEventListener('change', () => {
            STATE.grade = gradeSelect.value;
            updateUnits();
        });
        bookSelect.addEventListener('change', () => {
            STATE.book = bookSelect.value;
            updateUnits();
        });
        unitSelect.addEventListener('change', onUnitChange);

        modeSingleBtn.addEventListener('click', () => switchMode('single'));
        modePkBtn.addEventListener('click', () => switchMode('pk'));

        glassToggleBtn.addEventListener('click', toggleGlass);

        // 单人
        singlePlayBtn.addEventListener('click', () => Single.playAudio());
        singleReplayBtn.addEventListener('click', () => Single.replayAudio());
        singleNextBtn.addEventListener('click', () => Single.next());
        singleResetBtn.addEventListener('click', () => Single.reset());

        // PK
        pkPlayBtn.addEventListener('click', () => PK.playAudio());
        pkReplayBtn.addEventListener('click', () => PK.replayAudio());
        pkStartBtn.addEventListener('click', () => PK.start());
        pkResetBtn.addEventListener('click', () => PK.reset());
        pkAddPlayerBtn.addEventListener('click', () => PK.addPlayer());

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                if (STATE.mode === 'single') {
                    e.preventDefault();
                    if (!STATE.single.isPlaying && !STATE.single.answered && !STATE.single.audioLock) {
                        Single.playAudio();
                    }
                } else if (STATE.mode === 'pk') {
                    if (STATE.pk.isActive && !STATE.pk.isPlaying && !STATE.pk.audioLock && !STATE.pk
                        .roundFinished) {
                        e.preventDefault();
                        PK.playAudio();
                    }
                }
            }
        });

        // ================================================================
        //  12. 启动
        // ================================================================
        populateGrades();
        STATE.grade = '4';
        STATE.book = 'upper';
        gradeSelect.value = '4';
        bookSelect.value = 'upper';
        updateUnits();
        switchMode('single');

        setTimeout(() => {
            singleStatus.textContent = '🎧 点击「开始练习」听录音选词';
            singleStatus.className = 'status-badge';
        }, 300);

        console.log('🎧 听力练习已启动！');
        console.log('📁 录音文件放于 ./audio/ 目录，命名为 "单词.mp3"');
        console.log('💡 无录音文件时自动使用语音合成 (TTS)');
        console.log('⌨️ 空格键快速播放 (单人模式)');
        console.log('✨ 高级渲染已启用 iOS 26 风格');
    </script>
</body>
</html>
