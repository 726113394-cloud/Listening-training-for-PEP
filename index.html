        // ================================================================
        //  7. 单人模式 (保持不变)
        // ================================================================
        const Single = {
            buildWordList() {
                let allWords = [];
                const units = STATE.selectedUnits;
                const grade = STATE.grade;
                const book = STATE.book;
                for (const unit of units) {
                    const unitWords = getWords(grade, book, unit);
                    const selected = STATE.selectedWordsPerUnit[unit];
                    let wordsToAdd = unitWords;
                    if (selected && selected.length > 0) {
                        wordsToAdd = unitWords.filter(w => selected.includes(w.word));
                    }
                    allWords = allWords.concat(wordsToAdd);
                }
                const seen = new Set();
                const unique = [];
                for (const w of allWords) {
                    if (!seen.has(w.word)) {
                        seen.add(w.word);
                        unique.push(w);
                    }
                }
                return unique;
            },

            loadWords() {
                const all = this.buildWordList();
                const valid = all.filter(w => w.word && w.word.trim().length > 0);
                STATE.single.words = shuffle([...valid]);
                STATE.single.index = 0;
                STATE.single.score = 0;
                STATE.single.total = STATE.single.words.length;
                STATE.single.answered = false;
                STATE.single.selectedIdx = -1;
                STATE.single.played = false;
                STATE.single.isPlaying = false;
                STATE.single.audioLock = false;
                STATE.single.history = [];
                if (STATE.single.autoNextTimer) {
                    clearTimeout(STATE.single.autoNextTimer);
                    STATE.single.autoNextTimer = null;
                }
                this.updateUI();
                this.renderQuestion();
                this.updateUnitBadge();
            },

            renderQuestion() {
                const words = STATE.single.words;
                const idx = STATE.single.index;
                if (idx >= words.length || words.length === 0) {
                    singleOptions.innerHTML =
                        `<div style="grid-column:1/-1; text-align:center; padding:20px; color:#5a7a4a;">🎉 全部完成！点击「重新开始」再来一轮</div>`;
                    singleStatus.textContent = '🎉 全部完成！';
                    singleStatus.className = 'status-badge done';
                    singlePlayBtn.disabled = true;
                    singleReplayBtn.disabled = true;
                    singleProgress.textContent = `${words.length}/${words.length}`;
                    return;
                }

                const word = words[idx];
                const pool = words;
                const opts = pickOptions(word.word, pool, 3);
                STATE.single.options = opts;
                STATE.single.correctWord = word.word;
                STATE.single.answered = false;
                STATE.single.selectedIdx = -1;
                STATE.single.played = false;
                STATE.single.isPlaying = false;
                STATE.single.audioLock = false;

                const letters = ['A', 'B', 'C'];
                let html = '';
                opts.forEach((opt, i) => {
                    html += `<div class="option-card" data-idx="${i}" data-word="${opt}">
                                <span class="letter">${letters[i]}</span>
                                <span class="opt-text">${opt}</span>
                                <span class="check-mark"></span>
                             </div>`;
                });
                singleOptions.innerHTML = html;

                singleOptions.querySelectorAll('.option-card').forEach(el => {
                    el.addEventListener('click', () => {
                        if (STATE.single.answered) return;
                        const idx = parseInt(el.dataset.idx);
                        this.selectOption(idx);
                    });
                });

                singleStatus.textContent = '🎧 点击「开始练习」听录音选词';
                singleStatus.className = 'status-badge';
                singlePlayBtn.disabled = false;
                singleReplayBtn.disabled = true;
                singleProgress.textContent = `${idx+1}/${words.length}`;
                this.updateUI();

                singleOptions.querySelectorAll('.option-card').forEach(el => {
                    el.className = 'option-card';
                    el.querySelector('.check-mark').textContent = '';
                });
            },

            selectOption(idx) {
                if (STATE.single.answered) return;
                const cards = singleOptions.querySelectorAll('.option-card');
                const selectedWord = cards[idx].dataset.word;
                const correct = STATE.single.correctWord;
                const isCorrect = selectedWord === correct;

                const wordObj = STATE.single.words[STATE.single.index];
                STATE.single.history.push({
                    word: wordObj.word,
                    meaning: wordObj.meaning,
                    correct: isCorrect,
                    timestamp: Date.now()
                });

                STATE.single.answered = true;
                STATE.single.selectedIdx = idx;

                AudioEngine.stop();
                STATE.single.isPlaying = false;
                STATE.single.audioLock = false;
                singlePlayBtn.disabled = false;
                singleReplayBtn.disabled = true;

                if (isCorrect) {
                    STATE.single.score += 2;
                    sfx.correct();
                    singleStatus.textContent = '✅ 答对了！ +2分';
                    singleStatus.className = 'status-badge correct';
                    this.bumpScore();
                } else {
                    STATE.single.score = Math.max(0, STATE.single.score - 1);
                    sfx.wrong();
                    singleStatus.textContent = `❌ 正确答案是 “${correct}” -1分`;
                    singleStatus.className = 'status-badge wrong';
                    this.bumpScore();
                }

                cards.forEach((el, i) => {
                    el.classList.add('disabled');
                    const w = el.dataset.word;
                    if (w === correct) {
                        el.classList.add('correct');
                        el.querySelector('.check-mark').textContent = '✅';
                    } else if (i === idx && !isCorrect) {
                        el.classList.add('wrong');
                        el.querySelector('.check-mark').textContent = '❌';
                    }
                    if (i === idx) el.classList.add('selected');
                });

                this.updateUI();

                const delay = isCorrect ? 1000 : 2000;
                if (STATE.single.autoNextTimer) clearTimeout(STATE.single.autoNextTimer);
                STATE.single.autoNextTimer = setTimeout(() => {
                    this.next();
                }, delay);
            },

            playAudio() {
                if (STATE.single.audioLock) return;
                const words = STATE.single.words;
                const idx = STATE.single.index;
                if (idx >= words.length) return;
                if (STATE.single.isPlaying) return;
                const word = words[idx].word;

                STATE.single.audioLock = true;
                STATE.single.isPlaying = true;
                singlePlayBtn.disabled = true;
                singleReplayBtn.disabled = true;
                singleStatus.textContent = '🔊 播放中 ...';
                singleStatus.className = 'status-badge playing';

                AudioEngine.play(word,
                    () => {},
                    () => {
                        STATE.single.isPlaying = false;
                        STATE.single.audioLock = false;
                        singlePlayBtn.disabled = false;
                        singleReplayBtn.disabled = false;
                        if (!STATE.single.answered) {
                            singleStatus.textContent = '🔊 播放完毕，请选择答案';
                            singleStatus.className = 'status-badge done';
                            STATE.single.played = true;
                        }
                    }
                );
            },

            replayAudio() {
                if (STATE.single.audioLock) return;
                if (STATE.single.answered) return;
                const words = STATE.single.words;
                const idx = STATE.single.index;
                if (idx >= words.length) return;
                const word = words[idx].word;

                STATE.single.audioLock = true;
                STATE.single.isPlaying = true;
                singlePlayBtn.disabled = true;
                singleReplayBtn.disabled = true;
                singleStatus.textContent = '🔊 再听一次 ...';
                singleStatus.className = 'status-badge playing';

                AudioEngine.play(word,
                    () => {},
                    () => {
                        STATE.single.isPlaying = false;
                        STATE.single.audioLock = false;
                        singlePlayBtn.disabled = false;
                        singleReplayBtn.disabled = false;
                        if (!STATE.single.answered) {
                            singleStatus.textContent = '🔊 播放完毕，请选择答案';
                            singleStatus.className = 'status-badge done';
                        }
                    }
                );
            },

            next() {
                if (!STATE.single.answered) return;
                STATE.single.index++;
                if (STATE.single.index >= STATE.single.words.length) {
                    this.renderQuestion();
                    singleStatus.textContent = '🎉 全部完成！';
                    singleStatus.className = 'status-badge done';
                    singlePlayBtn.disabled = true;
                    singleReplayBtn.disabled = true;
                    sfx.cheer();
                    showFirework(document.querySelector('.listening-area'));
                    return;
                }
                sfx.next();
                this.renderQuestion();
                setTimeout(() => {
                    if (!STATE.single.answered && !STATE.single.isPlaying) {
                        this.playAudio();
                    }
                }, 400);
            },

            reset() {
                AudioEngine.stop();
                STATE.single.isPlaying = false;
                STATE.single.audioLock = false;
                if (STATE.single.autoNextTimer) {
                    clearTimeout(STATE.single.autoNextTimer);
                    STATE.single.autoNextTimer = null;
                }
                this.loadWords();
                sfx.reset();
                singleStatus.textContent = '🔄 已重置';
                singleStatus.className = 'status-badge';
                singlePlayBtn.disabled = false;
                singleReplayBtn.disabled = true;
            },

            updateUI() {
                const total = STATE.single.words.length;
                const done = STATE.single.index + (STATE.single.answered ? 1 : 0);
                singleProgress.textContent = `${Math.min(done, total)}/${total}`;
                singleScore.textContent = STATE.single.score;
            },

            bumpScore() {
                const el = singleScore;
                el.classList.remove('bump');
                void el.offsetWidth;
                el.classList.add('bump');
            },

            updateUnitBadge() {
                const count = STATE.selectedUnits.length;
                unitBadge.textContent = count;
            },

            showHistory() {
                const history = STATE.single.history;
                if (history.length === 0) {
                    alert('暂无练习记录');
                    return;
                }
                let html = `<div class="history-card">
                            <h2>📜 练习历史 (${history.length} 个)</h2>
                            <div class="history-list">`;
                history.forEach((item, idx) => {
                    const icon = item.correct ? '✅' : '❌';
                    html += `<div class="history-item" data-index="${idx}">
                                <span>${icon} ${item.word}</span>
                                <span class="word-badge">${item.meaning}</span>
                             </div>`;
                });
                html += `</div><button class="history-close">关闭</button></div>`;

                const modal = document.createElement('div');
                modal.className = 'history-modal';
                modal.innerHTML = html;
                document.body.appendChild(modal);

                modal.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = parseInt(el.dataset.index);
                        const item = history[idx];
                        AudioEngine.play(item.word,
                            () => {
                                singleStatus.textContent = `🔊 重听 "${item.word}" (复习)`;
                                singleStatus.className = 'status-badge playing';
                            },
                            () => {
                                singleStatus.textContent = `🔊 播放完毕 (复习)`;
                                singleStatus.className = 'status-badge done';
                            }
                        );
                    });
                });

                modal.querySelector('.history-close').addEventListener('click', () => {
                    modal.remove();
                });
            }
        };

        // ================================================================
        //  8. 多人模式
        // ================================================================
        const Multi = {
            init() {
                const p1 = this.addPlayer('玩家1');
                const p2 = this.addPlayer('玩家2');
                this.loadWords();
                this.renderPlayers();
                this.renderQuestion();
                this.updateUI();
            },

            addPlayer(name) {
                const id = 'p' + (++STATE.multi.playerIdCounter);
                const player = { id, name, score: 0, wrongCount: 0 };
                STATE.multi.players.push(player);
                STATE.multi.playerStatus[id] = 'pending';
                this.renderPlayers();
                this.updateUI();
                return player;
            },

            removePlayer(id) {
                if (STATE.multi.players.length <= 2) {
                    alert('至少保留2名玩家');
                    return false;
                }
                STATE.multi.players = STATE.multi.players.filter(p => p.id !== id);
                delete STATE.multi.playerStatus[id];
                this.renderPlayers();
                this.updateUI();
                return true;
            },

            renamePlayer(id, newName) {
                const p = STATE.multi.players.find(p => p.id === id);
                if (p && newName.trim()) {
                    p.name = newName.trim();
                    this.renderPlayers();
                }
            },

            buildWordList() {
                let allWords = [];
                const units = STATE.selectedUnits;
                const grade = STATE.grade;
                const book = STATE.book;
                for (const unit of units) {
                    const unitWords = getWords(grade, book, unit);
                    const selected = STATE.selectedWordsPerUnit[unit];
                    let wordsToAdd = unitWords;
                    if (selected && selected.length > 0) {
                        wordsToAdd = unitWords.filter(w => selected.includes(w.word));
                    }
                    allWords = allWords.concat(wordsToAdd);
                }
                const seen = new Set();
                const unique = [];
                for (const w of allWords) {
                    if (!seen.has(w.word)) {
                        seen.add(w.word);
                        unique.push(w);
                    }
                }
                return unique;
            },

            loadWords() {
                const all = this.buildWordList();
                const valid = all.filter(w => w.word && w.word.trim().length > 0);
                STATE.multi.words = shuffle([...valid]);
                STATE.multi.index = 0;
                STATE.multi.players.forEach(p => { p.score = 0;
                    p.wrongCount = 0; });
                STATE.multi.history = [];
                STATE.multi.answered = false;
                STATE.multi.correctPlayerId = null;
                STATE.multi.allWrong = false;
                STATE.multi.isPlaying = false;
                STATE.multi.audioLock = false;
                STATE.multi.played = false;
                if (STATE.multi.autoNextTimer) {
                    clearTimeout(STATE.multi.autoNextTimer);
                    STATE.multi.autoNextTimer = null;
                }
                STATE.multi.players.forEach(p => {
                    STATE.multi.playerStatus[p.id] = 'pending';
                });
                this.renderPlayers();
                this.renderQuestion();
                this.updateUI();
                this.updateUnitBadge();
            },

            renderQuestion() {
                const words = STATE.multi.words;
                const idx = STATE.multi.index;
                const total = parseInt(multiTotalInput.value) || 10;

                if (idx >= total || idx >= words.length || words.length === 0) {
                    multiStatus.textContent = '🎉 全部完成！点击「重新开始」再来一轮';
                    multiStatus.className = 'status-badge done';
                    multiPlayBtn.disabled = true;
                    multiReplayBtn.disabled = true;
                    multiProgress.textContent = `${Math.min(idx, words.length)}/${total}`;
                    if (idx >= total || idx >= words.length) {
                        sfx.cheer();
                        showFirework(document.querySelector('.listening-area'));
                    }
                    return;
                }

                const word = words[idx];
                const pool = words;
                const opts = pickOptions(word.word, pool, 3);
                STATE.multi.options = opts;
                STATE.multi.correctWord = word.word;
                STATE.multi.answered = false;
                STATE.multi.correctPlayerId = null;
                STATE.multi.allWrong = false;
                STATE.multi.played = false;
                STATE.multi.isPlaying = false;
                STATE.multi.audioLock = false;

                STATE.multi.players.forEach(p => {
                    STATE.multi.playerStatus[p.id] = 'pending';
                });

                optLabelA.textContent = opts[0] || '---';
                optLabelB.textContent = opts[1] || '---';
                optLabelC.textContent = opts[2] || '---';

                multiStatus.textContent = '🎧 点击「开始练习」听录音，然后抢答！';
                multiStatus.className = 'status-badge multi-wait';
                multiPlayBtn.disabled = false;
                multiReplayBtn.disabled = true;
                multiProgress.textContent = `${idx+1}/${total}`;
                this.updateUI();
                this.renderPlayers();
            },

            renderPlayers() {
                const players = STATE.multi.players;
                if (players.length === 0) {
                    playersArea.innerHTML =
                        `<div style="text-align:center;padding:20px;color:#5a7a4a;width:100%;">请添加玩家</div>`;
                    return;
                }

                let html = '';
                const letters = ['A', 'B', 'C'];
                const statusMap = {
                    'pending': '⏳ 等待作答',
                    'correct': '✅ 正确！',
                    'wrong': '❌ 错误'
                };

                for (const p of players) {
                    const status = STATE.multi.playerStatus[p.id] || 'pending';
                    const isCorrect = status === 'correct';
                    const isWrong = status === 'wrong';
                    const isPending = status === 'pending';
                    const disabled = !isPending || STATE.multi.answered || STATE.multi.allWrong;

                    let cardClass = 'player-card';
                    if (isCorrect) cardClass += ' card-correct';
                    if (isWrong) cardClass += ' card-wrong';
                    if (STATE.multi.answered && !isCorrect && !isWrong) cardClass += ' card-locked';

                    let statusText = statusMap[status] || '⏳ 等待作答';
                    let statusClass = '';
                    if (isCorrect) statusClass = 'correct';
                    if (isWrong) statusClass = 'wrong';
                    if (STATE.multi.answered && !isCorrect && !isWrong) statusClass = 'locked';

                    html += `
                        <div class="${cardClass}" data-id="${p.id}">
                            <div class="p-name">
                                ${p.name}
                                <button class="p-edit" data-id="${p.id}">✎</button>
                            </div>
                            <div class="p-score">⭐ <span>${p.score}</span></div>
                            <div class="p-options">
                                ${letters.map((letter, idx) => {
                                    const optWord = STATE.multi.options[idx] || '';
                                    let btnClass = '';
                                    if (isCorrect && optWord === STATE.multi.correctWord) btnClass = 'p-correct';
                                    if (isWrong && optWord === STATE.multi.correctWord) btnClass = 'p-correct';
                                    if (isWrong && status === 'wrong') btnClass = 'p-wrong';
                                    if (isCorrect) btnClass = 'p-correct';
                                    return `<button class="${btnClass}" data-player="${p.id}" data-optidx="${idx}" ${disabled ? 'disabled' : ''}>${letter}</button>`;
                                }).join('')}
                            </div>
                            <div class="p-status ${statusClass}">${statusText}</div>
                            ${STATE.multi.players.length > 2 ? `<button class="p-remove" data-id="${p.id}">✕</button>` : ''}
                        </div>
                    `;
                }

                // 添加玩家按钮 — 独立一行，放在最底部
                if (STATE.multi.players.length < 5) {
                    html += `
                        <div class="player-add-wrapper">
                            <button class="player-add-btn" id="multiAddPlayerBtn">➕ 添加玩家</button>
                        </div>
                    `;
                }

                playersArea.innerHTML = html;

                // 事件绑定
                playersArea.querySelectorAll('.p-options button:not(:disabled)').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const playerId = btn.dataset.player;
                        const optIdx = parseInt(btn.dataset.optidx);
                        this.playerSelect(playerId, optIdx);
                    });
                });

                playersArea.querySelectorAll('.p-edit').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        const p = STATE.multi.players.find(p => p.id === id);
                        if (p) {
                            const newName = prompt('修改玩家名称：', p.name);
                            if (newName && newName.trim()) {
                                this.renamePlayer(id, newName.trim());
                            }
                        }
                    });
                });

                playersArea.querySelectorAll('.p-remove').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        this.removePlayer(id);
                    });
                });

                const addBtn = document.getElementById('multiAddPlayerBtn');
                if (addBtn) {
                    addBtn.addEventListener('click', () => {
                        const name = prompt('输入玩家名称：', `玩家${STATE.multi.players.length + 1}`);
                        if (name && name.trim()) {
                            this.addPlayer(name.trim());
                        } else if (name !== null) {
                            this.addPlayer(`玩家${STATE.multi.players.length + 1}`);
                        }
                    });
                }
            },

            playerSelect(playerId, optIdx) {
                if (STATE.multi.answered || STATE.multi.allWrong) return;
                const status = STATE.multi.playerStatus[playerId];
                if (status !== 'pending') return;

                const selectedWord = STATE.multi.options[optIdx];
                const correct = STATE.multi.correctWord;
                const isCorrect = selectedWord === correct;

                if (isCorrect) {
                    STATE.multi.playerStatus[playerId] = 'correct';
                    STATE.multi.answered = true;
                    STATE.multi.correctPlayerId = playerId;
                    const p = STATE.multi.players.find(p => p.id === playerId);
                    if (p) p.score += 2;
                    sfx.multiCorrect();
                    multiStatus.textContent = `🎉 ${p ? p.name : '玩家'} 抢答成功！ +2分`;
                    multiStatus.className = 'status-badge multi-correct';
                    // 在答对的玩家卡片位置放礼花
                    const cardEl = playersArea.querySelector(`.player-card[data-id="${playerId}"]`);
                    if (cardEl) {
                        setTimeout(() => showFirework(cardEl), 200);
                    } else {
                        showFirework(document.querySelector('.listening-area'));
                    }
                    const wordObj = STATE.multi.words[STATE.multi.index];
                    STATE.multi.history.push({
                        word: wordObj.word,
                        meaning: wordObj.meaning,
                        correctPlayer: p ? p.name : '未知',
                        wrongPlayers: STATE.multi.players.filter(pl => STATE.multi.playerStatus[pl.id] === 'wrong')
                            .map(pl => pl.name),
                        options: [...STATE.multi.options],
                        timestamp: Date.now()
                    });
                    if (STATE.multi.autoNextTimer) clearTimeout(STATE.multi.autoNextTimer);
                    STATE.multi.autoNextTimer = setTimeout(() => {
                        this.next();
                    }, 1500);
                } else {
                    STATE.multi.playerStatus[playerId] = 'wrong';
                    const p = STATE.multi.players.find(p => p.id === playerId);
                    if (p) p.wrongCount++;
                    sfx.wrong();
                    multiStatus.textContent = `❌ ${p ? p.name : '玩家'} 答错了！`;
                    multiStatus.className = 'status-badge multi-wrong';

                    const allWrong = STATE.multi.players.every(p => STATE.multi.playerStatus[p.id] === 'wrong');
                    if (allWrong) {
                        STATE.multi.allWrong = true;
                        multiStatus.textContent = `😅 所有人都答错了，正确答案是 “${correct}”`;
                        multiStatus.className = 'status-badge multi-wrong';
                        const wordObj = STATE.multi.words[STATE.multi.index];
                        STATE.multi.history.push({
                            word: wordObj.word,
                            meaning: wordObj.meaning,
                            correctPlayer: null,
                            wrongPlayers: STATE.multi.players.map(p => p.name),
                            options: [...STATE.multi.options],
                            timestamp: Date.now()
                        });
                        if (STATE.multi.autoNextTimer) clearTimeout(STATE.multi.autoNextTimer);
                        STATE.multi.autoNextTimer = setTimeout(() => {
                            this.next();
                        }, 2000);
                    } else {
                        multiStatus.textContent = `⏳ 还有玩家未作答，继续抢答...`;
                        multiStatus.className = 'status-badge multi-wait';
                    }
                }

                this.renderPlayers();
                this.updateUI();
            },

            playAudio() {
                if (STATE.multi.audioLock) return;
                const words = STATE.multi.words;
                const idx = STATE.multi.index;
                const total = parseInt(multiTotalInput.value) || 10;
                if (idx >= total || idx >= words.length) return;
                if (STATE.multi.isPlaying) return;
                const word = words[idx].word;

                STATE.multi.audioLock = true;
                STATE.multi.isPlaying = true;
                multiPlayBtn.disabled = true;
                multiReplayBtn.disabled = true;
                multiStatus.textContent = '🔊 播放中 ...';
                multiStatus.className = 'status-badge playing';

                AudioEngine.play(word,
                    () => {},
                    () => {
                        STATE.multi.isPlaying = false;
                        STATE.multi.audioLock = false;
                        multiPlayBtn.disabled = false;
                        multiReplayBtn.disabled = false;
                        if (!STATE.multi.answered && !STATE.multi.allWrong) {
                            multiStatus.textContent = '🔊 播放完毕，开始抢答！点击玩家卡片上的 A/B/C';
                            multiStatus.className = 'status-badge multi-wait';
                            STATE.multi.played = true;
                        }
                    }
                );
            },

            replayAudio() {
                if (STATE.multi.audioLock) return;
                if (STATE.multi.answered || STATE.multi.allWrong) return;
                const words = STATE.multi.words;
                const idx = STATE.multi.index;
                const total = parseInt(multiTotalInput.value) || 10;
                if (idx >= total || idx >= words.length) return;
                const word = words[idx].word;

                STATE.multi.audioLock = true;
                STATE.multi.isPlaying = true;
                multiPlayBtn.disabled = true;
                multiReplayBtn.disabled = true;
                multiStatus.textContent = '🔊 再听一次 ...';
                multiStatus.className = 'status-badge playing';

                AudioEngine.play(word,
                    () => {},
                    () => {
                        STATE.multi.isPlaying = false;
                        STATE.multi.audioLock = false;
                        multiPlayBtn.disabled = false;
                        multiReplayBtn.disabled = false;
                        if (!STATE.multi.answered && !STATE.multi.allWrong) {
                            multiStatus.textContent = '🔊 播放完毕，继续抢答！';
                            multiStatus.className = 'status-badge multi-wait';
                        }
                    }
                );
            },

            next() {
                const total = parseInt(multiTotalInput.value) || 10;
                STATE.multi.index++;
                if (STATE.multi.index >= total || STATE.multi.index >= STATE.multi.words.length) {
                    this.renderQuestion();
                    multiStatus.textContent = '🎉 全部完成！';
                    multiStatus.className = 'status-badge done';
                    multiPlayBtn.disabled = true;
                    multiReplayBtn.disabled = true;
                    sfx.cheer();
                    showFirework(document.querySelector('.listening-area'));
                    return;
                }
                sfx.next();
                this.renderQuestion();
                setTimeout(() => {
                    if (!STATE.multi.answered && !STATE.multi.allWrong && !STATE.multi.isPlaying) {
                        this.playAudio();
                    }
                }, 500);
            },

            reset() {
                AudioEngine.stop();
                STATE.multi.isPlaying = false;
                STATE.multi.audioLock = false;
                if (STATE.multi.autoNextTimer) {
                    clearTimeout(STATE.multi.autoNextTimer);
                    STATE.multi.autoNextTimer = null;
                }
                STATE.multi.players.forEach(p => { p.score = 0;
                    p.wrongCount = 0; });
                this.loadWords();
                sfx.reset();
                multiStatus.textContent = '🔄 已重置';
                multiStatus.className = 'status-badge';
                multiPlayBtn.disabled = false;
                multiReplayBtn.disabled = true;
                this.renderPlayers();
                this.updateUI();
            },

            updateUI() {
                const total = parseInt(multiTotalInput.value) || 10;
                const done = Math.min(STATE.multi.index + (STATE.multi.answered || STATE.multi.allWrong ? 1 : 0), total);
                multiProgress.textContent = `${Math.min(done, total)}/${total}`;
                const topScore = STATE.multi.players.reduce((max, p) => Math.max(max, p.score), 0);
                multiTopScore.textContent = topScore;
                this.updateUnitBadge();
            },

            updateUnitBadge() {
                const count = STATE.selectedUnits.length;
                unitBadge.textContent = count;
            },

            showHistory() {
                const history = STATE.multi.history;
                if (history.length === 0) {
                    alert('暂无练习记录');
                    return;
                }
                let html = `<div class="history-card">
                            <h2>📜 多人抢答历史 (${history.length} 题)</h2>
                            <div class="history-list">`;
                for (const item of history) {
                    const winner = item.correctPlayer ? `🏆 ${item.correctPlayer}` : '😅 无人答对';
                    const wrongs = item.wrongPlayers.length > 0 ? `❌ ${item.wrongPlayers.join(', ')}` : '';
                    html += `<div class="history-item">
                                <span>${item.word} <span class="word-badge">${item.meaning}</span></span>
                                <span style="font-size:0.7rem;">${winner} ${wrongs}</span>
                             </div>`;
                }
                html += `</div><button class="history-close">关闭</button></div>`;

                const modal = document.createElement('div');
                modal.className = 'history-modal';
                modal.innerHTML = html;
                document.body.appendChild(modal);

                modal.querySelector('.history-close').addEventListener('click', () => {
                    modal.remove();
                });
            }
        };

        // ================================================================
        //  9. 单元选择模态框
        // ================================================================
        function renderUnitModal() {
            const units = getUnits(STATE.grade, STATE.book);
            let html = `<div class="unit-list">`;
            for (const unit of units) {
                const checked = STATE.selectedUnits.includes(unit) ? 'checked' : '';
                const allWords = getWords(STATE.grade, STATE.book, unit);
                const selectedWords = STATE.selectedWordsPerUnit[unit] || [];
                const count = selectedWords.length > 0 ? selectedWords.length : allWords.length;
                const total = allWords.length;
                html += `
                    <div class="unit-item" data-unit="${unit}">
                        <input type="checkbox" class="unit-checkbox" value="${unit}" ${checked}>
                        <span class="unit-name">${unit}</span>
                        <span class="unit-count">${count}/${total}</span>
                        <div class="unit-actions">
                            <button class="unit-word-btn" data-unit="${unit}">📝</button>
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
            unitModalBody.innerHTML = html;

            unitModalBody.querySelectorAll('.unit-checkbox').forEach(cb => {
                cb.addEventListener('change', function() {
                    const unit = this.value;
                    if (this.checked) {
                        if (!STATE.selectedUnits.includes(unit)) {
                            STATE.selectedUnits.push(unit);
                        }
                    } else {
                        STATE.selectedUnits = STATE.selectedUnits.filter(u => u !== unit);
                    }
                    updateUnitModalCounts();
                });
            });

            unitModalBody.querySelectorAll('.unit-word-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const unit = this.dataset.unit;
                    openWordSelectModal(unit);
                });
            });

            function updateUnitModalCounts() {
                const items = unitModalBody.querySelectorAll('.unit-item');
                for (const item of items) {
                    const unit = item.dataset.unit;
                    const allWords = getWords(STATE.grade, STATE.book, unit);
                    const selectedWords = STATE.selectedWordsPerUnit[unit] || [];
                    const count = selectedWords.length > 0 ? selectedWords.length : allWords.length;
                    const total = allWords.length;
                    const countSpan = item.querySelector('.unit-count');
                    if (countSpan) countSpan.textContent = `${count}/${total}`;
                }
            }
        }

        function openWordSelectModal(unit) {
            const words = getWords(STATE.grade, STATE.book, unit);
            const selected = STATE.selectedWordsPerUnit[unit] || [];
            const selectedSet = new Set(selected.length > 0 ? selected : words.map(w => w.word));

            wordSelectTitle.textContent = `选择单词 - ${unit}`;
            let html = `
                <div class="word-list-actions">
                    <button class="select-all">全选</button>
                    <button class="deselect-all">全不选</button>
                    <button class="select-bold">仅粗体</button>
                </div>
                <div class="word-list">
            `;
            for (const w of words) {
                const checked = selectedSet.has(w.word) ? 'checked' : '';
                const boldTag = w.bold ? '<span class="bold-tag">粗体</span>' : '';
                html += `
                    <div class="word-item">
                        <input type="checkbox" class="word-checkbox" value="${w.word}" ${checked}>
                        <span class="word-text">${w.word}</span>
                        <span class="word-mean">${w.meaning}</span>
                        ${boldTag}
                    </div>
                `;
            }
            html += `</div>`;
            wordSelectBody.innerHTML = html;

            wordSelectBody.querySelector('.select-all').addEventListener('click', () => {
                wordSelectBody.querySelectorAll('.word-checkbox').forEach(cb => cb.checked = true);
            });
            wordSelectBody.querySelector('.deselect-all').addEventListener('click', () => {
                wordSelectBody.querySelectorAll('.word-checkbox').forEach(cb => cb.checked = false);
            });
            wordSelectBody.querySelector('.select-bold').addEventListener('click', () => {
                const items = wordSelectBody.querySelectorAll('.word-item');
                items.forEach(item => {
                    const cb = item.querySelector('.word-checkbox');
                    const boldTag = item.querySelector('.bold-tag');
                    cb.checked = !!boldTag;
                });
            });

            wordSelectModal.dataset.unit = unit;
            wordSelectModal.classList.add('show');
            unitModal.classList.remove('show');
        }

        // ================================================================
        //  10. 模态框事件绑定
        // ================================================================
        unitSelectBtn.addEventListener('click', () => {
            renderUnitModal();
            unitModal.classList.add('show');
        });

        unitModalCancel.addEventListener('click', () => {
            unitModal.classList.remove('show');
        });

        unitModalConfirm.addEventListener('click', () => {
            const units = getUnits(STATE.grade, STATE.book);
            STATE.selectedUnits = STATE.selectedUnits.filter(u => units.includes(u));
            if (STATE.selectedUnits.length === 0) {
                alert('请至少选择一个单元');
                return;
            }
            unitModal.classList.remove('show');
            Single.loadWords();
            Multi.loadWords();
            Multi.renderPlayers();
            Multi.renderQuestion();
            Multi.updateUI();
        });

        unitWordSelectBtn.addEventListener('click', () => {
            if (STATE.selectedUnits.length === 0) {
                const units = getUnits(STATE.grade, STATE.book);
                if (units.length > 0) {
                    STATE.selectedUnits = [units[0]];
                    renderUnitModal();
                }
            }
            if (STATE.selectedUnits.length > 0) {
                const unit = STATE.selectedUnits[0];
                openWordSelectModal(unit);
            } else {
                alert('请先选择单元');
            }
        });

        wordSelectBack.addEventListener('click', () => {
            wordSelectModal.classList.remove('show');
            unitModal.classList.add('show');
        });

        wordSelectCancel.addEventListener('click', () => {
            wordSelectModal.classList.remove('show');
            unitModal.classList.add('show');
        });

        wordSelectConfirm.addEventListener('click', () => {
            const unit = wordSelectModal.dataset.unit;
            if (!unit) return;
            const checkboxes = wordSelectBody.querySelectorAll('.word-checkbox');
            const selected = [];
            checkboxes.forEach(cb => {
                if (cb.checked) selected.push(cb.value);
            });
            if (selected.length === 0) {
                STATE.selectedWordsPerUnit[unit] = [];
            } else {
                STATE.selectedWordsPerUnit[unit] = selected;
            }
            wordSelectModal.classList.remove('show');
            unitModal.classList.add('show');
            renderUnitModal();
        });

        // ================================================================
        //  11. 年级/册别联动
        // ================================================================
        function populateGrades() {
            const grades = Object.keys(wordBank);
            gradeSelect.innerHTML = grades.map(g => `<option value="${g}">${g}年级</option>`).join('');
            gradeSelect.value = STATE.grade;
            updateUnits();
        }

        function updateUnits() {
            STATE.selectedUnits = [];
            STATE.selectedWordsPerUnit = {};
            const units = getUnits(STATE.grade, STATE.book);
            if (units.length > 0) {
                STATE.selectedUnits = [units[0]];
            }
            renderUnitModal();
            Single.loadWords();
            Multi.loadWords();
            Multi.renderPlayers();
            Multi.renderQuestion();
            Multi.updateUI();
        }

        function onUnitChange() {
            STATE.grade = gradeSelect.value;
            STATE.book = bookSelect.value;
            updateUnits();
            sfx.next();
        }

        // ================================================================
        //  12. 高级渲染
        // ================================================================
        function toggleGlass() {
            STATE.glass = !STATE.glass;
            if (STATE.glass) {
                document.documentElement.setAttribute('data-glass', 'enabled');
                glassToggleBtn.style.background = 'rgba(139,195,74,0.2)';
                glassToggleBtn.style.borderColor = '#8bc34a';
                glassToggleBtn.style.boxShadow = '0 0 12px rgba(139,195,74,0.2)';
            } else {
                document.documentElement.removeAttribute('data-glass');
                glassToggleBtn.style.background = 'rgba(255,255,255,0.3)';
                glassToggleBtn.style.borderColor = 'rgba(180,200,140,0.2)';
                glassToggleBtn.style.boxShadow = 'none';
            }
            localStorage.setItem('glassEnabled', STATE.glass ? 'true' : 'false');
        }

        const savedGlass = localStorage.getItem('glassEnabled');
        if (savedGlass === 'true') {
            STATE.glass = true;
            document.documentElement.setAttribute('data-glass', 'enabled');
            glassToggleBtn.style.background = 'rgba(139,195,74,0.2)';
            glassToggleBtn.style.borderColor = '#8bc34a';
            glassToggleBtn.style.boxShadow = '0 0 12px rgba(139,195,74,0.2)';
        }

        // ================================================================
        //  13. 模式切换 (带平滑动画)
        // ================================================================
        function switchMode(mode) {
            const oldPanel = document.querySelector('.mode-panel.active');
            const newPanel = mode === 'single' ? singlePanel : multiPanel;
            if (oldPanel === newPanel) return;

            // 获取新面板高度并设置父容器
            newPanel.style.display = 'block';
            void newPanel.offsetHeight; // 强制重排
            const height = newPanel.scrollHeight;
            mainContent.style.height = height + 'px';

            // 切换active类
            oldPanel.classList.remove('active');
            newPanel.classList.add('active');

            // 更新按钮状态
            modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));

            // 如果是多人模式，重新渲染以确保内容最新
            if (mode === 'multi') {
                Multi.renderPlayers();
                Multi.renderQuestion();
                Multi.updateUI();
            }
        }

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                switchMode(btn.dataset.mode);
            });
        });

        // ================================================================
        //  14. 事件绑定
        // ================================================================
        gradeSelect.addEventListener('change', onUnitChange);
        bookSelect.addEventListener('change', onUnitChange);
        glassToggleBtn.addEventListener('click', toggleGlass);

        singlePlayBtn.addEventListener('click', () => Single.playAudio());
        singleReplayBtn.addEventListener('click', () => Single.replayAudio());
        singleResetBtn.addEventListener('click', () => Single.reset());
        historyBtn.addEventListener('click', () => Single.showHistory());

        multiPlayBtn.addEventListener('click', () => Multi.playAudio());
        multiReplayBtn.addEventListener('click', () => Multi.replayAudio());
        multiResetBtn.addEventListener('click', () => Multi.reset());
        multiHistoryBtn.addEventListener('click', () => Multi.showHistory());

        multiTotalInput.addEventListener('change', function() {
            let val = parseInt(this.value) || 10;
            if (val < 3) val = 3;
            if (val > 30) val = 30;
            this.value = val;
            Multi.updateUI();
            const words = STATE.multi.words;
            if (STATE.multi.index >= val || STATE.multi.index >= words.length) {
                Multi.loadWords();
                Multi.renderPlayers();
                Multi.renderQuestion();
                Multi.updateUI();
            } else {
                Multi.renderQuestion();
                Multi.updateUI();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.code === 'Space') {
                const activeMode = document.querySelector('.mode-toggle button.active');
                if (!activeMode) return;
                const mode = activeMode.dataset.mode;
                if (mode === 'single') {
                    if (!STATE.single.isPlaying && !STATE.single.answered && !STATE.single.audioLock) {
                        e.preventDefault();
                        Single.playAudio();
                    }
                } else if (mode === 'multi') {
                    if (!STATE.multi.isPlaying && !STATE.multi.answered && !STATE.multi.allWrong && !STATE.multi
                        .audioLock) {
                        e.preventDefault();
                        Multi.playAudio();
                    }
                }
            }
        });

        unitModal.addEventListener('click', (e) => {
            if (e.target === unitModal) unitModal.classList.remove('show');
        });
        wordSelectModal.addEventListener('click', (e) => {
            if (e.target === wordSelectModal) wordSelectModal.classList.remove('show');
        });

        // ================================================================
        //  15. 启动
        // ================================================================
        populateGrades();
        STATE.grade = '4';
        STATE.book = 'upper';
        gradeSelect.value = '4';
        bookSelect.value = 'upper';
        updateUnits();
        Multi.init();

        // 初始高度自适应
        setTimeout(() => {
            const activePanel = document.querySelector('.mode-panel.active');
            if (activePanel) {
                mainContent.style.height = activePanel.scrollHeight + 'px';
            }
        }, 100);

        // 窗口resize时重新计算高度
        window.addEventListener('resize', () => {
            const activePanel = document.querySelector('.mode-panel.active');
            if (activePanel) {
                mainContent.style.height = activePanel.scrollHeight + 'px';
            }
        });

        console.log('🎧 听力练习场已启动！');
        console.log('👥 多人模式：玩家卡片在下方，抢答按钮为 A/B/C');
        console.log('🎆 答对时礼花会在对应玩家卡片位置绽放');
        console.log('✨ 高级渲染已启用 iOS 26 风格毛玻璃与高光');
    </script>
</body>
</html>
