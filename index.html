<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>听力练习场 · 多人抢答</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, 'PingFang SC', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: linear-gradient(145deg, #f5f9e6 0%, #e2f0d6 100%);
            transition: background 0.4s ease;
        }
        .app-container {
            max-width: 960px;
            width: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 60px rgba(80, 120, 60, 0.12);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .header {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }
        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #3a6b2a;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.3px;
        }
        .logo span {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 4px;
        }
        .header-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: center;
        }
        .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .ctrl-group label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #5a7a4a;
            font-weight: 700;
        }
        .ctrl-group select {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(180, 200, 140, 0.4);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2a4a1a;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .ctrl-group select:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #a0c870;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(80, 140, 40, 0.08);
        }
        .btn-unit-select {
            background: rgba(139, 195, 74, 0.2);
            border: 1px solid rgba(139, 195, 74, 0.3);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #2a4a1a;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-unit-select:hover {
            background: rgba(139, 195, 74, 0.35);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 12px rgba(139, 195, 74, 0.15);
        }
        .btn-unit-select .badge {
            background: #8bc34a;
            color: #fff;
            border-radius: 20px;
            padding: 0 8px;
            font-size: 0.6rem;
            line-height: 1.6;
        }
        .mode-toggle {
            display: flex;
            gap: 4px;
            background: rgba(200, 220, 180, 0.2);
            border-radius: 40px;
            padding: 3px;
            border: 1px solid rgba(180, 200, 140, 0.15);
        }
        .mode-toggle button {
            padding: 4px 16px;
            border: none;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            background: transparent;
            color: #5a7a4a;
        }
        .mode-toggle button.active {
            background: rgba(139, 195, 74, 0.25);
            color: #2a4a1a;
            box-shadow: 0 2px 8px rgba(139, 195, 74, 0.1);
        }
        .mode-toggle button:hover:not(.active) {
            background: rgba(255, 255, 255, 0.3);
        }
        .main-content {
            position: relative;
            min-height: 420px;
            padding: 14px 20px 20px;
            transition: height 0.35s ease;
        }
        .mode-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
            padding: 0 4px;
        }
        .mode-panel.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* ===== 单人模式 ===== */
        .info-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #2a4a1a;
        }
        .info-item .num {
            background: rgba(139, 195, 74, 0.15);
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 700;
            color: #3a6b2a;
            transition: all 0.3s;
            display: inline-block;
        }
        .info-item .score-num {
            background: linear-gradient(135deg, #ffb74d, #ff8a65);
            color: #fff;
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 700;
            transition: all 0.3s;
            display: inline-block;
        }
        .info-actions {
            display: flex;
            gap: 6px;
        }
        .info-actions .history-btn {
            background: rgba(139, 195, 74, 0.15);
            border: 1px solid rgba(139, 195, 74, 0.2);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #3a6b2a;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .info-actions .history-btn:hover {
            background: rgba(139, 195, 74, 0.25);
            transform: translateY(-2px) scale(1.02);
        }
        .listening-area {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 16px 20px 18px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
            text-align: center;
            transition: all 0.3s;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(200, 220, 160, 0.25);
            color: #3a6b2a;
            border: 1px solid rgba(180, 200, 140, 0.2);
            transition: all 0.4s ease;
            margin-bottom: 10px;
            min-height: 30px;
            line-height: 1.8;
        }
        .status-badge.playing {
            background: #d4e8c0;
            color: #2a5a1a;
            border-color: #8bc34a;
            animation: pulse-badge 0.9s infinite;
        }
        .status-badge.done {
            background: #d4e8c0;
            color: #2a6a2a;
            border-color: #8bc34a;
        }
        .status-badge.correct {
            background: #c8e6c9;
            color: #1a6a2a;
            border-color: #66bb6a;
            animation: correctPop 0.5s ease;
        }
        .status-badge.wrong {
            background: #ffcdd2;
            color: #a33a3a;
            border-color: #ef9a9a;
            animation: wrongShake 0.5s ease;
        }
        .status-badge.multi-wait {
            background: #e3f0d9;
            color: #3a6b2a;
            border-color: #a0c870;
        }
        .status-badge.multi-correct {
            background: #c8e6c9;
            color: #1a6a2a;
            border-color: #66bb6a;
            animation: correctPop 0.5s ease;
        }
        .status-badge.multi-wrong {
            background: #ffcdd2;
            color: #a33a3a;
            border-color: #ef9a9a;
            animation: wrongShake 0.5s ease;
        }
        .status-badge.multi-locked {
            background: #fff3e0;
            color: #8a6a3a;
            border-color: #ffcc80;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.98);
            }
        }
        @keyframes correctPop {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes wrongShake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-8px);
            }
            40% {
                transform: translateX(8px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }
        .audio-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin: 4px 0 10px;
        }
        .audio-btn {
            padding: 7px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
        }
        .audio-btn:active {
            transform: scale(0.94);
        }
        .audio-btn.primary {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            box-shadow: 0 4px 20px rgba(139, 195, 74, 0.25);
        }
        .audio-btn.primary:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 28px rgba(139, 195, 74, 0.3);
        }
        .audio-btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .audio-btn.secondary {
            background: rgba(255, 255, 255, 0.6);
            color: #3a6b2a;
            border: 1px solid rgba(180, 200, 140, 0.3);
        }
        .audio-btn.secondary:hover:not(:disabled) {
            background: #fff;
            border-color: #8bc34a;
            transform: translateY(-3px) scale(1.02);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin: 10px 0 8px;
        }
        .option-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid rgba(180, 200, 140, 0.3);
            border-radius: 40px;
            padding: 12px 10px;
            font-size: 1rem;
            font-weight: 700;
            color: #1a3a0a;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
            text-align: center;
            user-select: none;
            position: relative;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            will-change: transform, border-color, background;
        }
        .option-card .letter {
            background: rgba(180, 200, 140, 0.2);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 800;
            color: #3a6b2a;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .option-card:hover:not(.disabled) {
            transform: translateY(-4px) scale(1.02);
            border-color: #8bc34a;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 24px rgba(139, 195, 74, 0.10);
        }
        .option-card.selected {
            border-color: #8bc34a;
            background: rgba(139, 195, 74, 0.10);
            transform: scale(0.98);
        }
        .option-card.correct {
            border-color: #66bb6a;
            background: rgba(102, 187, 106, 0.18);
            color: #1a6a2a;
            animation: correctFlash 0.6s ease;
        }
        .option-card.wrong {
            border-color: #ef5350;
            background: rgba(239, 83, 80, 0.12);
            color: #a33a3a;
            animation: wrongFlash 0.6s ease;
        }
        .option-card.disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none !important;
        }
        .option-card .check-mark {
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        @keyframes correctFlash {
            0% {
                transform: scale(0.95);
                background: rgba(102, 187, 106, 0.3);
            }
            50% {
                transform: scale(1.04);
                background: rgba(102, 187, 106, 0.25);
            }
            100% {
                transform: scale(1);
                background: rgba(102, 187, 106, 0.18);
            }
        }
        @keyframes wrongFlash {
            0% {
                transform: translateX(-4px);
                background: rgba(239, 83, 80, 0.2);
            }
            25% {
                transform: translateX(4px);
            }
            50% {
                transform: translateX(-2px);
            }
            75% {
                transform: translateX(2px);
            }
            100% {
                transform: translateX(0);
                background: rgba(239, 83, 80, 0.12);
            }
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }
        .action-btn {
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn:active {
            transform: scale(0.94);
        }
        .action-btn.reset {
            background: rgba(180, 200, 140, 0.25);
            color: #3a6b2a;
            border: 1px solid rgba(180, 200, 140, 0.2);
        }
        .action-btn.reset:hover {
            background: rgba(180, 200, 140, 0.4);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px rgba(180, 200, 140, 0.15);
        }

        /* ===== 多人模式 ===== */
        .multi-topbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
            margin-bottom: 12px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .multi-topbar .info-item {
            font-size: 0.8rem;
        }
        .multi-topbar .info-item .num {
            background: rgba(139, 195, 74, 0.15);
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 700;
            color: #3a6b2a;
        }
        .multi-topbar .info-item .score-num {
            background: linear-gradient(135deg, #ffb74d, #ff8a65);
            color: #fff;
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 700;
        }
        .multi-topbar .config-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #3a6b2a;
        }
        .multi-topbar .config-group input {
            width: 44px;
            padding: 3px 6px;
            border-radius: 20px;
            border: 1px solid rgba(180, 200, 140, 0.3);
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.5);
            color: #1a3a0a;
            outline: none;
        }
        .multi-topbar .config-group input:focus {
            border-color: #8bc34a;
            background: #fff;
        }

        /* 玩家卡片区域 - 置于底部 */
        .players-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: stretch;
            margin-top: 14px;
            margin-bottom: 4px;
        }
        .player-card {
            flex: 1 1 140px;
            max-width: 220px;
            min-width: 120px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 28px;
            padding: 10px 12px 12px;
            border: 2px solid rgba(180, 200, 140, 0.2);
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
        }
        .player-card .p-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: #1a3a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .player-card .p-name .p-edit {
            background: none;
            border: none;
            font-size: 0.6rem;
            cursor: pointer;
            color: #8aae6a;
            padding: 0 4px;
        }
        .player-card .p-name .p-edit:hover {
            color: #558b2f;
        }
        .player-card .p-score {
            font-size: 0.7rem;
            color: #5a7a4a;
            font-weight: 600;
            margin: 2px 0 6px;
        }
        .player-card .p-score span {
            background: linear-gradient(135deg, #ffb74d, #ff8a65);
            color: #fff;
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        .player-card .p-options {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin: 4px 0;
        }
        .player-card .p-options button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(180, 200, 140, 0.3);
            background: rgba(255, 255, 255, 0.5);
            font-weight: 800;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #2a4a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .player-card .p-options button:hover:not(:disabled) {
            background: rgba(139, 195, 74, 0.15);
            border-color: #8bc34a;
            transform: scale(1.08);
        }
        .player-card .p-options button:disabled {
            cursor: not-allowed;
            opacity: 0.4;
            transform: none !important;
        }
        .player-card .p-options button.p-correct {
            background: #66bb6a;
            border-color: #66bb6a;
            color: #fff;
        }
        .player-card .p-options button.p-wrong {
            background: #ef5350;
            border-color: #ef5350;
            color: #fff;
        }
        .player-card .p-options button.p-selected {
            background: rgba(139, 195, 74, 0.2);
            border-color: #8bc34a;
        }
        .player-card .p-status {
            font-size: 0.6rem;
            font-weight: 600;
            color: #5a7a4a;
            margin-top: 4px;
            min-height: 18px;
        }
        .player-card .p-status.correct {
            color: #2a7a2a;
        }
        .player-card .p-status.wrong {
            color: #a33a3a;
        }
        .player-card .p-status.locked {
            color: #8a6a3a;
        }
        .player-card .p-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: rgba(239, 83, 80, 0.15);
            color: #a33a3a;
            font-size: 0.55rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .player-card .p-remove:hover {
            background: rgba(239, 83, 80, 0.3);
            transform: scale(1.1);
        }
        .player-card.card-correct {
            border-color: #66bb6a;
            background: rgba(102, 187, 106, 0.1);
            box-shadow: 0 0 20px rgba(102, 187, 106, 0.08);
        }
        .player-card.card-wrong {
            border-color: #ef5350;
            background: rgba(239, 83, 80, 0.06);
        }
        .player-card.card-locked {
            border-color: #ffcc80;
            background: rgba(255, 204, 128, 0.06);
        }

        /* 添加按钮独立行 */
        .player-add-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 6px;
        }
        .player-add-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 28px;
            border-radius: 40px;
            border: 2px dashed rgba(180, 200, 140, 0.3);
            background: rgba(255, 255, 255, 0.15);
            font-weight: 700;
            font-size: 0.85rem;
            color: #5a7a4a;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            min-width: 140px;

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 60, 20, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: modalFade 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes modalFade {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 24px 28px;
            max-width: 640px;
            width: 92%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
        }
        .modal-card h2 {
            color: #2a4a1a;
            margin-bottom: 10px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-card .modal-body {
            flex: 1;
            overflow-y: auto;
            margin: 6px 0 10px;
            padding-right: 4px;
        }
        .modal-card .modal-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            border-top: 1px solid rgba(180, 200, 140, 0.2);
            padding-top: 12px;
        }
        .modal-card .modal-footer button {
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .modal-card .modal-footer .btn-confirm {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
        }
        .modal-card .modal-footer .btn-confirm:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(139, 195, 74, 0.25);
        }
        .modal-card .modal-footer .btn-cancel {
            background: rgba(180, 200, 140, 0.2);
            color: #3a6b2a;
        }
        .modal-card .modal-footer .btn-cancel:hover {
            background: rgba(180, 200, 140, 0.35);
            transform: translateY(-2px);
        }
        .modal-card .modal-footer .btn-secondary {
            background: rgba(139, 195, 74, 0.15);
            color: #2a4a1a;
            border: 1px solid rgba(139, 195, 74, 0.2);
        }
        .modal-card .modal-footer .btn-secondary:hover {
            background: rgba(139, 195, 74, 0.25);
            transform: translateY(-2px);
        }
        .sub-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .sub-header .back-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #5a7a4a;
            transition: 0.2s;
            padding: 0 4px;
        }
        .sub-header .back-btn:hover {
            transform: scale(1.1);
            color: #3a6b2a;
        }
        .sub-header h3 {
            font-size: 1rem;
            color: #2a4a1a;
        }

        .unit-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .unit-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            border: 1px solid rgba(180, 200, 140, 0.15);
            transition: background 0.2s;
        }
        .unit-item:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .unit-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #8bc34a;
            cursor: pointer;
            flex-shrink: 0;
        }
        .unit-item .unit-name {
            flex: 1;
            font-weight: 600;
            color: #1a3a0a;
            font-size: 0.9rem;
        }
        .unit-item .unit-count {
            font-size: 0.65rem;
            color: #5a7a4a;
            background: rgba(180, 200, 140, 0.15);
            padding: 0 10px;
            border-radius: 20px;
        }
        .unit-item .unit-actions button {
            background: rgba(139, 195, 74, 0.1);
            border: none;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.6rem;
            font-weight: 700;
            color: #3a6b2a;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .unit-item .unit-actions button:hover {
            background: rgba(139, 195, 74, 0.25);
            transform: scale(1.05);
        }
        .word-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 4px;
        }
        .word-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(180, 200, 140, 0.1);
        }
        .word-item input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #8bc34a;
            cursor: pointer;
            flex-shrink: 0;
        }
        .word-item .word-text {
            font-weight: 500;
            font-size: 0.8rem;
            color: #1a3a0a;
        }
        .word-item .word-mean {
            font-size: 0.65rem;
            color: #5a7a4a;
            margin-left: auto;
        }
        .word-item .bold-tag {
            background: #fee9d4;
            font-size: 0.5rem;
            padding: 0 6px;
            border-radius: 10px;
            color: #8a6a3a;
        }
        .word-list-actions {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .word-list-actions button {
            background: rgba(180, 200, 140, 0.15);
            border: none;
            border-radius: 20px;
            padding: 3px 14px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #3a6b2a;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .word-list-actions button:hover {
            background: rgba(139, 195, 74, 0.25);
            transform: scale(1.04);
        }

        /* ===== 历史/排名 ===== */
        .history-modal,
        .rank-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 60, 20, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: modalFade 0.3s ease;
        }
        .history-card,
        .rank-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 28px 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
            max-height: 80vh;
            overflow-y: auto;
        }
        .history-card h2,
        .rank-card h2 {
            color: #2a4a1a;
            margin-bottom: 12px;
            font-size: 1.3rem;
        }
        .history-list,
        .rank-list {
            text-align: left;
            margin: 12px 0;
        }
        .history-item,
        .rank-item {
            padding: 6px 12px;
            border-bottom: 1px solid rgba(180, 200, 140, 0.2);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            color: #2a4a1a;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .history-item:hover {
            background: rgba(139, 195, 74, 0.08);
            border-radius: 12px;
            transform: translateX(4px);
        }
        .history-close,
        .rank-close {
            background: linear-gradient(135deg, #8bc34a, #558b2f);
            color: #fff;
            border: none;
            padding: 8px 28px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.85rem;
            margin-top: 6px;
        }
        .history-close:hover,
        .rank-close:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 24px rgba(139, 195, 74, 0.2);
        }
        .history-item .word-badge {
            background: rgba(139, 195, 74, 0.15);
            padding: 0 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        .firework-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 720px) {
            .header {

                justify-content: center;

                padding: 12px 14px;

                grid-template-columns: 1fr;
            }

                padding: 8px 10px 14px;
                min-height: 380px;
            }

                padding: 6px 16px;
                font-size: 0.75rem;
            }

                padding: 6px 16px;
                font-size: 0.75rem;
            }

                padding: 8px 6px;
                min-height: 44px;
                font-size: 0.85rem;
            }
            .modal-card {
                padding: 16px;
                border-radius: 32px;
            }
            .word-list {
                grid-template-columns: 1fr 1fr;
            }
            .player-card {
                flex: 1 1 110px;
                min-width: 90px;
                padding: 8px 8px 10px;
            }
            .player-card .p-options button {
                width: 28px;
                height: 28px;
                font-size: 0.6rem;
            }

        @media (max-width: 480px) {
            .app-container {
                border-radius: 28px;
            }
            .logo {
                font-size: 1rem;
            }
            .word-list {
                grid-template-columns: 1fr;
            }
            .player-card {
                flex: 1 1 80px;

                padding: 6px 6px 8px;
            }
            .player-card .p-options button {
                width: 24px;
                height: 24px;
                font-size: 0.5rem;
            }
            .player-add-btn {
                min-width: 100px;
                height: 36px;
                font-size: 0.7rem;
                padding: 4px 16px;
            }
        }
        .hidden {
            display: none !important;
        }
        .text-muted {
            color: #5a7a4a;
            font-size: 0.75rem;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getWords(grade, book, unit) {
            return wordBank[grade]?.[book]?.[unit] || [];
        }

        function getUnits(grade, book) {
            const data = wordBank[grade]?.[book];
            return data ? Object.keys(data).sort() : [];
        }

        function pickOptions(correct, pool, count = 3) {
            const others = pool.filter(w => w.word !== correct);
            const shuffled = shuffle([...others]);
            const selected = [correct, ...shuffled.slice(0, count - 1).map(w => w.word)];
            while (selected.length < count) {
                const fallback = ['apple', 'book', 'cat', 'dog', 'fish', 'school', 'teacher', 'student'];
                for (const f of fallback) {
                    if (!selected.includes(f)) { selected.push(f); break; }
                }
                if (selected.length >= count) break;
            }
            return shuffle(selected);
        }

        function getAudioUrl(word) {
            return `./audio/${encodeURIComponent(word)}.mp3`;

        const sfx = {
            ctx: null,
            playTone(freq, dur, type = 'sine', vol = 0.2) {
                try {
                    if (!this.ctx) this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.value = vol;
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                    osc.stop(this.ctx.currentTime + dur);
                } catch (_) {}
            },
            correct() { this.playTone(880, 0.10);
                setTimeout(() => this.playTone(1108, 0.14), 90); },
            wrong() { this.playTone(280, 0.2, 'sawtooth', 0.12); },
            next() { this.playTone(660, 0.07); },

        const fwCanvas = document.getElementById('fireworkCanvas');
        const fwCtx = fwCanvas.getContext('2d');
        let fwParticles = [];
        let fwAnimId = null;

        function resizeFw() { fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeFw);
        resizeFw();

        class FwParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#ff8a5c', '#a29bfe', '#8bc34a'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = 3 + Math.random() * 4;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8 - 2;
                this.gravity = 0.15;
                this.alpha = 1;
                this.decay = 0.015 + Math.random() * 0.025;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }
            draw() {
                fwCtx.globalAlpha = this.alpha;
                fwCtx.fillStyle = this.color;
                fwCtx.beginPath();
                fwCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                fwCtx.fill();
                fwCtx.globalAlpha = 1;
            }
        }

        function firework(x, y) {
            for (let i = 0; i < 60; i++) fwParticles.push(new FwParticle(x, y));
            if (!fwAnimId) fwAnimId = requestAnimationFrame(animateFw);
        }

        function animateFw() {
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            let alive = false;
            for (const p of fwParticles) {
                if (p.update()) { alive = true;
                    p.draw(); }
            }
            fwParticles = fwParticles.filter(p => p.alpha > 0);
            if (alive) fwAnimId = requestAnimationFrame(animateFw);
            else { fwAnimId = null;
                fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height); }
        }

        function showFirework(el) {
            if (!el) return;
            const r = el.getBoundingClientRect();
            firework(r.left + r.width / 2, r.top + r.height / 3);
        }

        // ================================================================

        const AudioEngine = {
            audio: null,
            isPlaying: false,
            word: '',
            useTTS: false,

            checkAudioFile(word) {
                return new Promise((resolve) => {
                    const url = getAudioUrl(word);
                    const audio = new Audio();
                    audio.preload = 'none';
                    const timeout = setTimeout(() => {
                        audio.src = '';
                        resolve(false);
                    }, 2000);
                    audio.oncanplaythrough = () => {
                        clearTimeout(timeout);
                        audio.src = '';
                        resolve(true);
                    };
                    audio.onerror = () => {
                        clearTimeout(timeout);
                        audio.src = '';
                        resolve(false);
                    };
                    audio.src = url;
                    audio.load();
                });
            },

            play(word, onStart, onEnd) {
                return new Promise(async (resolve) => {
                    this.stop();
                    this.word = word;

                    const hasFile = await this.checkAudioFile(word);
                    if (hasFile) {
                        this.useTTS = false;
                        this.audio = new Audio(getAudioUrl(word));
                        this.audio.oncanplaythrough = () => {
                            if (onStart) onStart();
                        };
                        this.audio.onended = () => {
                            this.isPlaying = false;
                            if (onEnd) onEnd();
                            resolve();
                        };
                        this.audio.onerror = () => {
                            this.isPlaying = false;
                            this.playTTS(word, onStart, onEnd).then(resolve);
                        };
                        this.audio.play().catch(() => {
                            this.isPlaying = false;
                            this.playTTS(word, onStart, onEnd).then(resolve);
                        });
                        this.isPlaying = true;
                    } else {
                        this.playTTS(word, onStart, onEnd).then(resolve);
                    }
                });
            },

            playTTS(word, onStart, onEnd) {
                return new Promise((resolve) => {
                    this.useTTS = true;
                    if (!window.speechSynthesis) {
                        if (onEnd) onEnd();
                        resolve();
                        return;
                    }
                    window.speechSynthesis.cancel();

                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    utterance.volume = 1.0;

                    const voices = window.speechSynthesis.getVoices();
                    const enVoice = voices.find(v => v.lang.startsWith('en'));
                    if (enVoice) utterance.voice = enVoice;

                    utterance.onstart = () => {
                        this.isPlaying = true;
                        if (onStart) onStart();
                    };
                    utterance.onend = () => {
                        this.isPlaying = false;
                        if (onEnd) onEnd();
                        resolve();
                    };
                    utterance.onerror = () => {
                        this.isPlaying = false;
                        if (onEnd) onEnd();
                        resolve();
                    };
                    window.speechSynthesis.speak(utterance);
                });
            },

            stop() {
                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                    this.audio = null;
                }
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                this.isPlaying = false;
            },

            isPlayingNow() {
                return this.isPlaying;
            }
        };

        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
